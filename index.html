<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>极简排版 · 公众号排版编辑器</title>
<style>
  :root{
    --bg:#f5f5f7;
    --panel:#ffffff;
    --line:#e8e8ec;
    --line-soft:#f0f0f3;
    --ink:#1f2024;
    --ink-2:#5b5d66;
    --ink-3:#9a9ca6;
    --accent:#1f2937;
    --shadow:0 1px 2px rgba(16,18,27,.04), 0 8px 24px rgba(16,18,27,.06);
    --radius:12px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button,input,select,textarea{ font:inherit; color:inherit; }

  /* ---------- 顶栏 ---------- */
  .topbar{
    height:56px; flex:0 0 56px;
    display:flex; align-items:center; gap:14px;
    padding:0 16px;
    background:rgba(255,255,255,.86);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
    position:relative; z-index:30;
  }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:650; letter-spacing:.3px; }
  .brand .mark{
    width:24px;height:24px;border-radius:7px;
    background:var(--ink); color:#fff;
    display:grid;place-items:center;
    font-size:12px;font-weight:700;letter-spacing:0;
  }
  .brand .sub{ font-weight:400; color:var(--ink-3); font-size:12px; margin-left:2px; }
  .topbar .spacer{ flex:1; }
  .stat{ font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  #saveStat{ padding:2px 8px; border-radius:6px; background:#f2f2f5; cursor:pointer; }
  #saveStat:hover{ background:#eaeaef; }
  #saveStat.warn:hover{ background:#f6e2e6; }
  #saveStat.ok{ color:#276852; background:#eef6f2; }
  #saveStat.warn{ color:#8c3649; background:#fbf0f2; font-weight:600; }

  .btn{
    height:34px; padding:0 14px;
    border:1px solid var(--line);
    background:#fff; color:var(--ink);
    border-radius:9px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:.15s ease; white-space:nowrap;
  }
  .btn:hover{ background:#fafafb; border-color:#dcdce3; }
  .btn:active{ transform:translateY(.5px); }
  .btn.primary{
    background:var(--ink); border-color:var(--ink); color:#fff; font-weight:600;
    padding:0 18px;
  }
  .btn.primary:hover{ background:#000; border-color:#000; }
  .btn.ghost{ border-color:transparent; background:transparent; color:var(--ink-2); }
  .btn.ghost:hover{ background:#f0f0f3; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .btn.icon{ width:34px; padding:0; justify-content:center; }
  .btn kbd{
    font-family:var(--mono); font-size:10px; opacity:.55;
    border:1px solid currentColor; border-radius:4px; padding:0 3px; line-height:14px;
  }

  /* ---------- 布局 ---------- */
  .app{ height:100%; display:flex; flex-direction:column; }
  .body{ flex:1; display:flex; min-height:0; }

  .stage{ flex:1; min-width:0; display:flex; flex-direction:column; }

  /* ---------- 工具栏 ---------- */
  .toolbar{
    flex:0 0 auto;
    padding:10px 16px 0;
    display:flex; justify-content:center;
  }
  .toolbar-inner{
    display:flex; align-items:center; gap:2px; flex-wrap:wrap;
    padding:5px 6px;
    background:#fff; border:1px solid var(--line);
    border-radius:11px; box-shadow:0 1px 2px rgba(16,18,27,.03);
    max-width:100%;
  }
  .tb{
    height:30px; min-width:30px; padding:0 8px;
    border:0; background:transparent; border-radius:7px;
    cursor:pointer; color:var(--ink-2);
    display:inline-flex; align-items:center; justify-content:center;
    transition:.12s; font-size:13px; line-height:1;
  }
  .tb:hover{ background:#f2f2f5; color:var(--ink); }
  .tb.on{ background:#eef0f4; color:var(--ink); }
  .tb svg{ width:16px; height:16px; display:block; }
  .tb .b{ font-weight:800; font-size:15px; }
  .tb .i{ font-style:italic; font-family:Georgia,serif; font-size:15px; }
  .tb .u{ text-decoration:underline; text-underline-offset:2px; font-size:15px; }
  .tb .s{ text-decoration:line-through; font-size:15px; }
  .sep{ width:1px; height:18px; background:var(--line); margin:0 5px; flex:0 0 1px; }

  /* ---------- 画布 ---------- */
  .scroll{
    flex:1; min-height:0; overflow:auto; padding:24px 16px 120px;
    scrollbar-width:thin;
  }
  .canvas{
    width:100%; max-width:720px; margin:0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:44px 46px 56px;
    transition:box-shadow .3s ease, max-width .3s ease;
  }
  .canvas.flash{ box-shadow:0 0 0 3px rgba(31,41,55,.07), var(--shadow); }
  @media (max-width:720px){ .canvas{ padding:28px 20px 40px; } }



  .editor{ outline:none; min-height:340px; }
  .editor:focus{ outline:none; }
  .editor.is-empty::before{
    content:attr(data-ph);
    color:#c3c4cc; pointer-events:none;
    display:block; font-size:15px; line-height:1.9; white-space:pre-line;
  }

  /* ---------- 编辑区内的主题镜像样式（排版前的近似预览） ---------- */
  .editor p{ margin:var(--sp-before) 0 var(--gap); font-size:var(--fs); line-height:var(--lh);
    letter-spacing:var(--ls); color:var(--text); font-family:var(--font); font-weight:var(--fw);
    text-align:var(--ta); text-indent:var(--ti); word-break:break-word;
    padding-left:var(--side); padding-right:var(--side); }
  .editor h1{ margin:0 0 20px; font-size:calc(var(--fs) + 8px); line-height:1.42;
    font-weight:800; color:var(--head); font-family:var(--head-font); letter-spacing:.4px;
    padding-left:var(--side); padding-right:var(--side); }
  .editor h2,.editor h3,.editor h4{ font-family:var(--head-font); color:var(--head); line-height:1.5; }
  .editor h2{ font-size:calc(var(--fs) + 4px); font-weight:700;
    margin:calc(var(--sp-before) + var(--gap) * 1.7) 0 calc(var(--gap) * .8);
    padding-left:var(--side); padding-right:var(--side); }
  .editor h3{ font-size:calc(var(--fs) + 2px); font-weight:600;
    margin:calc(var(--sp-before) + var(--gap) * 1.4) 0 calc(var(--gap) * .6);
    padding-left:var(--side); padding-right:var(--side); }
  .editor h4{ font-size:var(--fs); font-weight:600;
    margin:calc(var(--sp-before) + var(--gap)) 0 calc(var(--gap) * .5);
    padding-left:var(--side); padding-right:var(--side); }
  .editor[data-h="bar"] h2{ border-left:4px solid var(--accent); margin-left:-4px; padding-left:calc(12px + var(--side)); }
  .editor[data-h="bar"] h3{ border-left:3px solid var(--accent); margin-left:-3px; padding-left:calc(10px + var(--side)); }
  .editor[data-h="plainColor"] h2,.editor[data-h="plainColor"] h3{ color:var(--accent); text-align:center; }
  .editor blockquote{
    margin:calc(var(--sp-before) + var(--gap) * 1.4) 0 calc(var(--gap) * 1.4);
    padding:14px calc(18px + var(--side));
    background:var(--soft); border-left:3px solid var(--accent);
    border-radius:0 6px 6px 0; color:var(--text-2);
    font-size:calc(var(--fs) - 1px); line-height:var(--lh); font-family:var(--font);
    font-weight:var(--fw);
  }
  .editor blockquote p{ margin:0 0 .6em; font-size:inherit; color:inherit; }
  .editor blockquote p:last-child{ margin-bottom:0; }
  .editor ul,.editor ol{ margin:calc(var(--sp-before) + var(--gap)) 0 var(--gap);
    padding-left:calc(1.4em + var(--side)); padding-right:var(--side); }
  .editor li{ margin:0 0 calc(var(--gap) * .5); font-size:var(--fs); line-height:var(--lh);
    letter-spacing:var(--ls); color:var(--text); font-family:var(--font); font-weight:var(--fw); }
  .editor li::marker{ color:var(--accent); }
  .editor img{ max-width:100%; height:auto; display:block;
    margin:calc(var(--sp-before) + var(--gap) * 1.5) auto calc(var(--gap) * 1.5);
    border-radius:6px; }

  /* ---------- 滑动图集 / 单图 / 图注 ---------- */
  .editor [data-jp="gallery"]{ margin:calc(var(--sp-before) + var(--gap) * 1.6) 0 calc(var(--gap) * 1.6);
    padding-left:var(--side); padding-right:var(--side); }
  .editor [data-jp="figure"]{ margin:calc(var(--sp-before) + var(--gap) * 1.5) 0 calc(var(--gap) * 1.5);
    padding-left:var(--side); padding-right:var(--side); }
  .editor [data-jp="cap"]{
    margin-top:8px; text-align:center;
    font-size:12px; line-height:1.6; letter-spacing:.2px; color:var(--cap);
  }
  /* 自动字数标记：灰色小字居中 */
  .editor [data-jp="wordcount"]{
    margin:calc(var(--sp-before) + var(--gap) * 1.6) var(--side) calc(var(--gap) * 1.2);
    padding:8px 0; text-align:center;
    font-family:var(--font); font-size:12px; line-height:1.6; letter-spacing:.5px;
    color:var(--faint);
  }
  .editor [data-jp="strip"]{
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    white-space:nowrap;
    /* mandatory 会把小步滚动吸回原位（鼠标滚轮一格约 100px，不到半张图），
       所以用 proximity；对齐用 start，索引计算才准。 */
    scroll-snap-type:x proximity;
    scrollbar-width:none; -ms-overflow-style:none;
    font-size:0; cursor:grab;
    scroll-behavior:smooth;
  }
  .editor [data-jp="strip"]:active{ cursor:grabbing; }
  .editor [data-jp="strip"]::-webkit-scrollbar{ display:none; }
  .editor [data-jp="cell"]{
    display:inline-block; vertical-align:top;
    width:84%; max-width:84%; margin:0 8px 0 0;
    white-space:normal;
    scroll-snap-align:start;
  }
  .editor [data-jp="cell"]:last-child{ margin-right:0; }
  .editor [data-jp="strip"] img{
    display:inline-block; vertical-align:top;
    width:100%; max-width:100%; height:auto;
    margin:0; border-radius:6px;
    -webkit-user-drag:none;
  }
  .editor [data-jp="hint"]{
    margin-top:10px; text-align:center;
    font-size:11px; line-height:1; letter-spacing:3px; color:var(--faint);
  }
  .editor pre{
    margin:calc(var(--sp-before) + var(--gap) * 1.4) 0 calc(var(--gap) * 1.4);
    padding:16px calc(16px + var(--side)); overflow:auto;
    background:#1f2430; color:#e4e6eb; border-radius:8px;
    font-family:var(--mono); font-size:13px; line-height:1.7;
    white-space:pre-wrap; word-break:break-word; }
  .editor code{
    font-family:var(--mono); font-size:.9em; background:var(--code-bg);
    color:var(--accent); padding:2px 5px; border-radius:4px; }
  .editor pre code{ background:none; color:inherit; padding:0; }
  .editor a{ color:var(--accent); text-decoration:none; border-bottom:1px solid rgba(120,120,130,.35); }
  .editor strong,.editor b{ font-weight:600; color:var(--head); }
  .editor table{ width:calc(100% - var(--side) * 2); border-collapse:collapse;
    margin:calc(var(--sp-before) + var(--gap)) var(--side) var(--gap);
    font-size:calc(var(--fs) - 1px); }
  .editor th,.editor td{ border:1px solid var(--hairline); padding:8px 10px; text-align:left; }
  .editor th{ background:#fafafb; font-weight:600; }

  /* ---------- 侧栏 ---------- */
  .side{
    flex:0 0 292px; width:292px;
    border-left:1px solid var(--line);
    background:var(--panel);
    overflow:auto; padding:16px 16px 40px;
    scrollbar-width:thin;
  }
  @media (max-width:960px){
    .side{
      position:fixed; top:56px; right:0; bottom:0; z-index:40;
      box-shadow:-12px 0 32px rgba(16,18,27,.10);
      transform:translateX(102%); transition:transform .26s cubic-bezier(.32,.72,0,1);
    }
    .side.open{ transform:none; }
  }
  .group{ margin-bottom:22px; }
  .group > h4{
    margin:0 0 10px; font-size:11px; font-weight:600; letter-spacing:1.4px;
    color:var(--ink-3); text-transform:uppercase;
  }
  .themes{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .theme{
    border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:9px 0 7px; cursor:pointer; transition:.15s;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .theme:hover{ border-color:#d6d6dd; }
  .theme.on{ border-color:var(--ink); box-shadow:0 0 0 1px var(--ink) inset; }
  .theme .dot{ width:18px; height:18px; border-radius:50%; }
  .theme .nm{ font-size:11px; color:var(--ink-2); }
  .theme.on .nm{ color:var(--ink); font-weight:600; }

  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .row .lb{ font-size:12.5px; color:var(--ink-2); }
  .row .val{ font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:34px; text-align:right; }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:22px; background:transparent; cursor:pointer; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{ height:3px; border-radius:3px; background:#e6e6ea; }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#fff; border:1px solid #c9c9d1; margin-top:-5.5px;
    box-shadow:0 1px 3px rgba(0,0,0,.14); transition:.12s;
  }
  input[type=range]::-webkit-slider-thumb:hover{ border-color:var(--ink); }
  input[type=range]::-moz-range-track{ height:3px; border-radius:3px; background:#e6e6ea; }
  input[type=range]::-moz-range-thumb{ width:13px;height:13px;border-radius:50%;background:#fff;border:1px solid #c9c9d1; }

  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip .nf{ font-size:9px; font-style:normal; opacity:.5; margin-left:3px; letter-spacing:0; }
  .chip.miss{ color:var(--ink-3); }
  .chip.miss.on{ color:#fff; }
  .font-note{ font-size:11px; line-height:1.7; color:var(--ink-3); margin-top:8px; min-height:0; }
  .chip{
    border:1px solid var(--line); background:#fff; border-radius:8px;
    height:28px; padding:0 10px; cursor:pointer; font-size:12px; color:var(--ink-2);
    transition:.14s;
  }
  .chip:hover{ border-color:#d6d6dd; }
  .chip.on{ background:var(--ink); border-color:var(--ink); color:#fff; font-weight:500; }

  .field{ display:block; margin-bottom:10px; }
  .field span{ display:block; font-size:12px; color:var(--ink-2); margin-bottom:5px; }
  .field input[type=text]{
    width:100%; height:34px; padding:0 11px; border:1px solid var(--line);
    border-radius:9px; background:#fbfbfc; outline:none; transition:.15s;
  }
  .field input[type=text]:focus{ background:#fff; border-color:#c9c9d1; }

  .colorline{ display:flex; align-items:center; gap:10px; }
  .swatches{ display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  .sw-wrap{ position:relative; display:inline-block; }
  .sw{ width:24px; height:24px; border-radius:6px; cursor:pointer; border:2px solid #fff;
       box-shadow:0 0 0 1px var(--line); transition:.12s; padding:0; position:relative; }
  .sw:hover{ transform:scale(1.12); box-shadow:0 0 0 1px var(--ink); }
  .sw.on{ box-shadow:0 0 0 2px var(--ink); border-color:#fff; }
  .sw-del{ position:absolute; top:-4px; right:-4px; width:14px; height:14px;
    background:#fff; color:var(--ink-3); font-size:10px; line-height:14px; text-align:center;
    border-radius:50%; box-shadow:0 0 0 1px var(--line); opacity:0; transition:.12s;
    cursor:pointer; z-index:2; }
  .sw-wrap:hover .sw-del{ opacity:1; }
  .sw-del:hover{ background:#fee; color:#b4232a; box-shadow:0 0 0 1px #b4232a; }
  .colorline .tb{ width:28px; height:28px; border-radius:8px; font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center; }
  input[type=color]{
    -webkit-appearance:none; appearance:none; border:1px solid var(--line);
    width:34px; height:34px; border-radius:9px; padding:0; background:#fff; cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{ padding:4px; }
  input[type=color]::-webkit-color-swatch{ border:0; border-radius:6px; }
  .hex{ font-family:var(--mono); font-size:12px; color:var(--ink-3); }

  .tips{ font-size:12px; line-height:1.85; color:var(--ink-3); }
  .tips b{ color:var(--ink-2); font-weight:600; }
  .tips ol{ margin:0; padding-left:16px; }
  .tips li{ margin-bottom:5px; }

  .side-toggle{ display:none; }
  @media (max-width:960px){ .side-toggle{ display:inline-flex; } }

  /* ---------- 图片工具条（选中图片后出现） ---------- */
  .canvas{ position:relative; }
  #imgHalo{
    position:absolute; display:none; pointer-events:none; z-index:5;
    border:2px solid #4f46e5; border-radius:5px;
    box-shadow:0 0 0 3px rgba(79,70,229,.14);
  }
  .imgbar{
    position:absolute; display:none; z-index:6;
    align-items:center; gap:5px;
    background:rgba(24,25,30,.95); color:#fff;
    border-radius:11px; padding:6px;
    box-shadow:0 10px 28px rgba(0,0,0,.24);
    max-width:calc(100% - 12px);
  }
  .imgbar.on{ display:flex; }

  /* 图集左右箭头：挂在画布浮层上，不属于正文，不会被复制走 */
  .galnav{
    position:absolute; display:none; z-index:6;
    align-items:center; justify-content:space-between;
    pointer-events:none;
  }
  .galnav.on{ display:flex; }
  .galnav button{
    pointer-events:auto; width:34px; height:34px; border-radius:50%;
    border:0; background:rgba(24,25,30,.6); color:#fff;
    font-size:18px; line-height:1; cursor:pointer; padding:0 0 2px;
    display:grid; place-items:center; transition:.15s;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
  }
  .galnav button:hover{ background:rgba(24,25,30,.88); }
  .galnav button[disabled]{ opacity:0; pointer-events:none; }
  .imgbar input{
    height:29px; width:158px; border:0; border-radius:7px;
    background:rgba(255,255,255,.13); color:#fff; padding:0 9px;
    font-size:12.5px; outline:none; transition:.14s;
  }
  .imgbar input::placeholder{ color:rgba(255,255,255,.42); }
  .imgbar input:focus{ background:rgba(255,255,255,.22); }
  .ib{
    height:29px; padding:0 10px; border:0; border-radius:7px;
    background:rgba(255,255,255,.13); color:#fff; cursor:pointer;
    font-size:12.5px; white-space:nowrap; transition:.14s;
  }
  .ib:hover{ background:rgba(255,255,255,.26); }
  .ib.danger:hover{ background:#c0392b; }
  @media (max-width:720px){ .imgbar input{ width:92px; } .ib{ padding:0 8px; } }

  /* ---------- 裁剪弹窗 ---------- */
  .crop-modal{ width:min(94vw,640px); }
  .ratios{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .crop-stage{
    position:relative; display:inline-block; max-width:100%;
    line-height:0; background:#14151a; border-radius:8px; overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  .crop-stage img{ display:block; max-width:100%; max-height:54vh; -webkit-user-drag:none; }
  .crop-box{
    position:absolute; box-sizing:border-box;
    border:1px solid rgba(255,255,255,.95);
    box-shadow:0 0 0 9999px rgba(0,0,0,.52);
    cursor:move;
  }
  .crop-box span{
    position:absolute; width:13px; height:13px; background:#fff;
    border-radius:3px; box-shadow:0 1px 4px rgba(0,0,0,.45);
  }
  /* 手柄放在框内侧：stage 用 overflow:hidden 裁掉遮罩，放外侧会被切掉一半 */
  .crop-box span[data-h="nw"]{ left:0; top:0; cursor:nwse-resize; }
  .crop-box span[data-h="ne"]{ right:0; top:0; cursor:nesw-resize; }
  .crop-box span[data-h="sw"]{ left:0; bottom:0; cursor:nesw-resize; }
  .crop-box span[data-h="se"]{ right:0; bottom:0; cursor:nwse-resize; }
  .crop-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; gap:12px; }
  .crop-out{ font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; }

  /* ---------- 表格选择器 ---------- */
  .tbl-grid{ display:grid; grid-template-columns:repeat(8,26px); gap:4px; margin:4px 0 10px; }
  .tbl-grid i{ height:23px; border:1px solid var(--line); border-radius:4px; background:#fbfbfc; cursor:pointer; transition:.1s; }
  .tbl-grid i.on{ background:var(--ink); border-color:var(--ink); }
  .tbl-count{ font-size:12px; color:var(--ink-3); min-height:17px; font-variant-numeric:tabular-nums; }

  /* ---------- 文稿列表 ---------- */
  .doc-list{ display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto; }
  .doc{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); border-radius:9px; padding:8px 9px;
    cursor:pointer; transition:.14s; background:#fff;
  }
  .doc:hover{ border-color:#d6d6dd; background:#fcfcfd; }
  .doc.on{ border-color:var(--ink); box-shadow:0 0 0 1px var(--ink) inset; }
  .doc .nm{ font-size:12.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .doc .sub{ font-size:11px; color:var(--ink-3); white-space:nowrap; }
  .doc .x{
    border:0; background:transparent; color:var(--ink-3); cursor:pointer;
    font-size:15px; line-height:1; padding:2px 5px; border-radius:5px; flex:0 0 auto;
  }
  .doc .x:hover{ background:#f0f0f3; color:#b4232a; }
  .doc-empty{ font-size:12px; color:var(--ink-3); line-height:1.7; }

  /* ---------- 模板列表 ---------- */
  .tpl-list{ display:flex; flex-direction:column; gap:6px; }
  .tpl{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); border-radius:9px; padding:8px 9px;
    cursor:pointer; transition:.14s; background:#fff;
  }
  .tpl:hover{ border-color:#d6d6dd; background:#fcfcfd; }
  .tpl .dot{ width:12px; height:12px; border-radius:50%; flex:0 0 12px; }
  .tpl .nm{ font-size:12.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tpl .sub{ font-size:11px; color:var(--ink-3); white-space:nowrap; }
  .tpl .x{
    border:0; background:transparent; color:var(--ink-3); cursor:pointer;
    font-size:15px; line-height:1; padding:2px 5px; border-radius:5px; flex:0 0 auto;
  }
  .tpl .x:hover{ background:#f0f0f3; color:#b4232a; }
  .tpl-empty{ font-size:12px; color:var(--ink-3); padding:2px 0 4px; line-height:1.7; }

  /* ---------- Toast ---------- */
  .toast-wrap{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    display:flex; flex-direction:column; gap:8px; align-items:center;
    z-index:80; pointer-events:none;
  }
  .toast{
    background:rgba(24,25,30,.94); color:#fff;
    padding:10px 16px; border-radius:10px; font-size:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.22);
    animation:tin .22s cubic-bezier(.2,.8,.3,1); white-space:nowrap;
  }
  .toast.out{ animation:tout .22s ease forwards; }
  @keyframes tin{ from{opacity:0; transform:translateY(8px) scale(.97);} }
  @keyframes tout{ to{opacity:0; transform:translateY(6px) scale(.98);} }

  .modal-mask{
    position:fixed; inset:0; background:rgba(20,21,26,.34);
    display:none; place-items:center; z-index:90;
    backdrop-filter:blur(2px);
  }
  .modal-mask.on{ display:grid; }
  .modal{
    width:min(92vw,380px); background:#fff; border-radius:14px; padding:20px;
    box-shadow:0 24px 60px rgba(0,0,0,.22);
    animation:tin .2s cubic-bezier(.2,.8,.3,1);
  }
  .modal h3{ margin:0 0 14px; font-size:15px; font-weight:650; }
  .modal input[type=text]{ width:100%; height:38px; padding:0 12px; border:1px solid var(--line);
    border-radius:9px; background:#fbfbfc; outline:none; }
  .modal input[type=text]:focus{ background:#fff; border-color:#c9c9d1; }
  .modal .acts{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }

  ::-webkit-scrollbar-thumb:hover{ background:#c2c2ca; }

</style>
