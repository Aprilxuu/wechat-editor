<script>
(function(){
  'use strict';

  /* ======================================================================
     1. 配置与主题
     ====================================================================== */


  /* 每套字体栈的第一个具名字体就是它真正想用的字体，检测也按它来 */
  const FONT_OPTIONS = [
    { id:'sys',  name:'默认',
      stack:'-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif',
      note:'由读者设备决定' },
    { id:'ping', name:'苹方（细）',
      stack:'PingFangSC-Light',
      note:'苹方 Light 字重' }
  ];

  const FONTS = {};
  FONT_OPTIONS.forEach(f => { FONTS[f.id] = f.stack; });

  /* 探测某个字体族在本机是否真的可用：拿它和 monospace 比字宽 */
  let _probeCtx;
  function primaryFamily(stack){
    const skip = /^(serif|sans-serif|monospace|system-ui|-apple-system|blinkmacsystemfont|"segoe ui"|roboto|georgia)$/i;
    const named = String(stack).split(',').map(x => x.trim()).filter(x => x && !skip.test(x));
    return named[0] || null;
  }
  const PROBE_TEXT = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

  /* 返回 true/false，判断不了时返回 null */
  function measureAvailable(family){
    try {
      if (_probeCtx === undefined) _probeCtx = document.createElement('canvas').getContext('2d');
      if (!_probeCtx || !_probeCtx.measureText) return null;
      // 用拉丁字符探测：中文探测会被系统回落干扰（macOS 上 monospace 的中文同样回落到苹方，
      // 测出来恒等），而这些中文字体都带拉丁字形，和等宽字体一比就知道有没有装上。
      _probeCtx.font = '64px monospace';
      const before = _probeCtx.font;
      const base = _probeCtx.measureText(PROBE_TEXT).width;
      _probeCtx.font = '64px ' + family + ', monospace';
      if (_probeCtx.font === before) return null;          // 字体串没生效，别瞎猜
      return Math.abs(_probeCtx.measureText(PROBE_TEXT).width - base) > 0.5;
    } catch (e) { return null; }
  }

  /* 自检：拿一个肯定不存在的字体试一次，测不出来就整个关掉标记，避免误报「未装」 */
  let _probeUsable = null;
  function probeUsable(){
    if (_probeUsable === null) _probeUsable = measureAvailable('"__jp_nonexistent__"') === false;
    return _probeUsable;
  }

  /* 字体栈探测：栈本身就是 fallback 链，第一个名字不一定在本机
     （比如思源黑体栈首是 Noto Sans SC 给安卓用，Mac 上装的是 Source Han Sans CN 在第二个）。
     所以遍历所有具名族，装到任何一个就算可用；栈里有系统字体（-apple-system / system-ui）
     则必定有兜底，直接按可用处理。 */
  function fontAvailable(stack){
    if (!probeUsable()) return true;                       // 探测不可用，全部按可用显示
    if (/(^|,\s*)(-apple-system|system-ui|BlinkMacSystemFont)/i.test(stack)) return true;
    const skip = /^(serif|sans-serif|monospace|cursive|fantasy)$/i;
    const named = String(stack).split(',').map(x => x.trim()).filter(x => x && !skip.test(x));
    if (!named.length) return true;
    for (const name of named){
      if (measureAvailable(name) !== false) return true;
    }
    return false;
  }

  const BLOCK_TAGS = new Set(['P','DIV','SECTION','ARTICLE','MAIN','HEADER','FOOTER','ASIDE','NAV',
    'H1','H2','H3','H4','H5','H6','BLOCKQUOTE','UL','OL','LI','IMG','HR','PRE','TABLE','THEAD',
    'TBODY','TR','TD','TH','FIGURE','FIGCAPTION','DL','DD','DT','ADDRESS','VIDEO','IFRAME']);

  const LS_DOC = 'jianpai.doc.v1';
  const LS_CFG = 'jianpai.cfg.v1';

  const state = {
    customAccent: '#313c3f',
    fs: 16, lh: 1.75, ls: 0.4, spBefore: 0, spAfter: 14, side: 0,
    font: 'sys', hStyle: 'bar',
    justify: true, indent: false
  };

  /* 中文阅读速度按 400 字/分钟估，行业常用区间 300–500，取中间偏快的一档 */
  const READ_SPEED = 400;

  /* ======================================================================
     2. DOM
     ====================================================================== */
  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  const editor   = $('#editor');
  const canvas   = $('#canvas');
  const scroll   = $('#scroll');
  const side     = $('#side');
  const statEl   = $('#stat');

  const fileInput= $('#fileInput');
  const linkMask = $('#linkMask');
  const linkUrl  = $('#linkUrl');

  const imgbar   = $('#imgbar');
  const imgHalo  = $('#imgHalo');
  const capInput = $('#capInput');
  const cropMask = $('#cropMask');
  const cropStage= $('#cropStage');
  const cropImg  = $('#cropImg');
  const cropBox  = $('#cropBox');

  let pickerMode = 'single';        // 'single' 单图 / 'gallery' 图集 / 'replace' 替换
  let selectedImg = null;           // 当前选中的图片

  /* ======================================================================
     3. 工具函数
     ====================================================================== */
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

  function toast(msg, ms){
    const wrap = $('#toastWrap');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 240);
    }, ms || 1900);
  }


  function cfg(){
    const accent = state.customAccent || '#313c3f';
    const textBase = '#3a3a3a';    // 正文固定中性深灰，不跟主题色走
    return {
      accent:   accent,
      text:     textBase,
      head:     deepen(textBase, .18),
      text2:    tint(textBase, .22),
      cap:      tint(textBase, .44),
      faint:    tint(textBase, .62),
      hairline: tint(textBase, .84),
      codeBg:   tint(textBase, .93),
      tableBg:  tint(textBase, .96),
      soft:     tint(textBase, .97),
      fs: state.fs, lh: state.lh, ls: state.ls,
      spBefore: state.spBefore, spAfter: state.spAfter, side: state.side,
      fontKey: state.font,
      font: fontForBake(state.font),
      // 标题固定用一档偏重的字重，不被正文的细体拖下去：
      // ping 时标题用 PingFangSC-Semibold（单字重 face，配 font-weight 才找得到）
      headFont: state.font === 'ping' ? 'PingFangSC-Semibold' : fontForBake(state.font),
      // 字重已编码进苹方 PostScript 名，不再额外发 font-weight
      weight: 400,
      justify: state.justify,
      indent: state.indent,
      hStyle: state.hStyle
    };
  }

  function fontForBake(fontKey){
    if (fontKey === 'ping') return 'PingFangSC-Light';
    return FONTS[fontKey] || FONTS.sys;
  }

  /* 把颜色朝灰白方向混合，用于次级文字 */
  function hex2rgb(hex){
    const h = String(hex).replace('#','');
    const n = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgb2hex(rgb){
    return '#' + rgb.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2,'0')).join('');
  }
  /* 朝某个颜色混 t（0~1） */
  function mixHex(a, b, t){
    const A = hex2rgb(a), B = hex2rgb(b);
    return rgb2hex(A.map((v, i) => v + (B[i] - v) * t));
  }

  /* 一篇文章里所有灰阶都从正文色推导，保证是"同一条灰阶"上的深浅，
     而不是几个互不相关的灰。以前标题跳到近黑、图注又是写死的灰，看着就不齐。 */
  const deepen = (hex, t) => mixHex(hex, '#000000', t);   // 往黑里压
  const tint   = (hex, t) => mixHex(hex, '#ffffff', t);   // 往白里提
  const shade  = (hex, amt) => mixHex(hex, '#8a8f98', amt); // 旧调用点保留：朝中性灰靠

  /* ======================================================================
     4. 编辑器视觉（CSS 变量 → 未排版内容的实时近似预览）
     ====================================================================== */
  function applyVisual(){
    const c = cfg();
    const s = editor.style;
    s.setProperty('--fs', c.fs + 'px');
    s.setProperty('--lh', c.lh);
    s.setProperty('--ls', c.ls + 'em');
    s.setProperty('--fw', c.weight);
    s.setProperty('--head-font', c.headFont);
    s.setProperty('--gap', c.spAfter + 'px');         // 段后距＝纵向节奏基数
    s.setProperty('--sp-before', c.spBefore + 'px');
    s.setProperty('--accent', c.accent);
    // 主题色同时挂到根上：工具栏「文字变色」按钮的色块也要跟着变
    document.documentElement.style.setProperty('--accent', c.accent);
    s.setProperty('--text', c.text);
    s.setProperty('--text-2', c.text2);
    s.setProperty('--head', c.head);
    s.setProperty('--cap', c.cap);
    s.setProperty('--faint', c.faint);
    s.setProperty('--hairline', c.hairline);
    s.setProperty('--soft', c.soft);
    s.setProperty('--code-bg', c.codeBg);
    s.setProperty('--font', c.font);
    s.setProperty('--ta', c.justify ? 'justify' : 'left');
    s.setProperty('--ti', c.indent ? '2em' : '0');
    s.setProperty('--side', (c.side || 0) + 'px');
    editor.dataset.h = c.hStyle;
  }

  /* ======================================================================
     5. 结构规范化：把任意粘贴来的 HTML 整理成 p / h2 / blockquote / ul …
     ====================================================================== */
  /* 允许出现块级子元素的容器：只有这些元素内部才需要递归修复 */
  const FLOW_HOST = new Set(['BLOCKQUOTE','LI','UL','OL','TD','TH','TR','TABLE','THEAD','TBODY',
    'DIV','SECTION','ARTICLE','MAIN','HEADER','FOOTER','ASIDE','NAV','DD','DL','FIGURE','FIGCAPTION']);

  const PURE_CONTAINER = new Set(['DIV','SECTION','ARTICLE','MAIN','HEADER','FOOTER','ASIDE','NAV','SPAN']);

  /* 编辑器自己生成的构件（图集等）带 data-jp，结构原样保留，不参与规范化 */
  const isJp = el => !!(el && el.getAttribute && el.getAttribute('data-jp'));

  function normalize(root){
    /* ---- 1. 结构修复：拆掉纯容器、div → p、font → span（只递归 flow 容器） ---- */
    (function repair(node){
      $$(':scope > *', node).forEach(el => {
        if (isJp(el)) return;                                 // 自有构件整棵跳过
        if (FLOW_HOST.has(el.tagName)) repair(el);
      });

      $$(':scope > *', node).forEach(el => {
        if (isJp(el)) return;
        const tag = el.tagName;

        if (tag === 'FONT'){
          const sp = document.createElement('span');
          while (el.firstChild) sp.appendChild(el.firstChild);
          el.replaceWith(sp);
          return;
        }
        if (!PURE_CONTAINER.has(tag)) return;

        const hasBlock = $$(':scope > *', el).some(c => BLOCK_TAGS.has(c.tagName));
        if (tag === 'SPAN' && !hasBlock) return;              // 行内 span 原样保留

        if (hasBlock){                                        // 纯容器 → 拆掉，内容上提
          const frag = document.createDocumentFragment();
          while (el.firstChild) frag.appendChild(el.firstChild);
          el.replaceWith(frag);
        } else {                                              // 内容型 div → p
          const p = document.createElement('p');
          while (el.firstChild) p.appendChild(el.firstChild);
          el.replaceWith(p);
        }
      });
    })(root);

    /* ---- 2. 只在根层把散落的行内节点包进 <p>（绝不能递归，否则会嵌套 p） ---- */
    let p = null;
    Array.from(root.childNodes).forEach(node => {
      if (node.nodeType === 3){
        if (!node.nodeValue.replace(/\u200b/g,'').trim()){ node.remove(); return; }
        if (!p){ p = document.createElement('p'); node.replaceWith(p); }
        p.appendChild(node);
      } else if (node.nodeType === 1){
        if (BLOCK_TAGS.has(node.tagName)){ p = null; return; }
        if (!p){ p = document.createElement('p'); node.replaceWith(p); }
        p.appendChild(node);
      } else {
        node.remove();
      }
    });
  }

  /* ======================================================================
     6. 一键排版：把主题样式作为内联 style 烤进 DOM（公众号直接可识别）
     ====================================================================== */
  function bake(silent){
    if (!editor.textContent.trim() && !editor.querySelector('img')) {
      if (!silent) toast('还没有内容可以排版');
      return;
    }
    const keepScroll = scroll.scrollTop;
    const c = cfg();

    normalize(editor);
    polishInline(editor);
    normalizeImages(editor);
    ensureEdges();
    styleTree(editor, c);

    scroll.scrollTop = keepScroll;
    canvas.classList.add('flash');
    setTimeout(() => canvas.classList.remove('flash'), 320);

    updateStat();
    saveDoc();
    if (selectedImg) layoutImgUI();
    scheduleHistory();
    if (!silent) toast('已重排');
  }

  function polishInline(root){
    $$('span, u, s, mark, font', root).forEach(el => {
      if (el.tagName === 'FONT'){
        // <font color="xxx"> → <span style="color:xxx">
        const c = el.getAttribute('color');
        const sp = document.createElement('span');
        while (el.firstChild) sp.appendChild(el.firstChild);
        if (c) sp.setAttribute('style', 'color:' + c + ';');
        el.replaceWith(sp);
        return;
      }
      if (el.tagName === 'SPAN'){
        // 只保留用户手动设的颜色，其余样式全清
        const m = (el.getAttribute('style') || '').match(/color:\s*(#[0-9a-fA-F]{3,8}|[a-z][a-z-]*)/);
        el.removeAttribute('style');
        if (m) el.setAttribute('style', 'color:' + m[1] + ';');
      }
      el.removeAttribute('class');
      el.removeAttribute('id');
    });
    $$('*', root).forEach(el => {
      el.removeAttribute('class');
      el.removeAttribute('id');
      el.removeAttribute('contenteditable');
    });
  }

  function styleTree(root, c){
    const head = c.head, accent = c.accent;

    // 设色前先看有没有用户手动设的，有就保留
    const userColor = (el, fallback) => {
      const m = (el.getAttribute('style') || '').match(/color:\s*(#[0-9a-fA-F]{3,8})/);
      return m ? m[1] : fallback;
    };
    const side = c.side || 0;                                  // 正文左右留白
    const pad  = side ? 'padding-left:' + side + 'px;padding-right:' + side + 'px;' : '';
    const mx   = side ? 'margin-left:' + side + 'px;margin-right:' + side + 'px;' : '';

    // 段前距 / 段后距：上边距 = 段前距 + 原倍数 × 段后距，下边距 = 原倍数 × 段后距。
    // 默认值（前 0 / 后 14）渲染出来和过去只有单一"段间距"时完全一致。
    const mtop = m => gapTop(c, m);
    const mbot = m => gapBot(c, m);

    const P = 'margin:' + mtop(0) + 'px 0 ' + mbot(1) + 'px;' + pad +
      'font-family:' + c.font + ';font-size:' + c.fs + 'px;' +
      'font-weight:' + c.weight + ';' +
      'line-height:' + c.lh + ';letter-spacing:' + c.ls + 'em;' +
      'color:' + c.text + ';text-align:' + (c.justify ? 'justify' : 'left') + ';' +
      'text-indent:' + (c.indent ? '2em' : '0') + ';word-break:break-word;';

    // 图集 / 单图先单独处理，内部元素不参与通用样式
    // 用 [data-jp] 而不是 figure[data-jp]：从备份还原时外层可能是 section
    $$('[data-jp="gallery"]', root).forEach(fig => styleGallery(fig, c));
    $$('[data-jp="figure"]', root).forEach(fig => styleFigure(fig, c));

    // 字数标记：灰色小字居中，和内容拉开层级
    $$('[data-jp="wordcount"]', root).forEach(el => {
      el.setAttribute('style',
        'margin:' + mtop(1.6) + 'px ' + side + 'px ' + mbot(1.2) + 'px;' +
        'padding:8px 0;text-align:center;' +
        'font-family:' + c.font + ';font-size:12px;line-height:1.6;letter-spacing:.5px;' +
        'color:' + c.faint + ';');
    });

    $$('*', root).forEach(el => {
      if (el.closest && el.closest('[data-jp]')) return;
      const inCell = el.closest && el.closest('td,th');
      const t = el.tagName;
      switch (t){
        case 'P':
          el.setAttribute('style', inCell
            ? 'margin:0;font-size:inherit;line-height:1.6;color:inherit;word-break:break-word;'
            : P);
          break;

        case 'H1':
          el.setAttribute('style', 'margin:' + mtop(0) + 'px 0 ' + mbot(1.5) + 'px;' + pad +
            'font-family:' + c.headFont + ';font-size:' + (c.fs + 8) + 'px;font-weight:800;line-height:1.42;' +
            'letter-spacing:.4px;color:' + head + ';text-align:left;word-break:break-word;');
          break;

        case 'H2': case 'H3': case 'H4': case 'H5': case 'H6': {
          const lvl = t === 'H2' ? 4 : (t === 'H3' ? 2 : 0);
          const fs  = c.fs + lvl;
          const fw  = t === 'H2' ? 700 : 600;
          const tMul = t === 'H2' ? 1.7 : (t === 'H3' ? 1.4 : 1.0);
          const bMul = t === 'H2' ? .8  : (t === 'H3' ? .6  : .5);
          // 主题色：h2/h3 居中、走主题色、字重收轻一档（靠颜色而不是黑度立起来）
          const isColor = c.hStyle === 'plainColor';
          const col = isColor ? accent : head;
          const wt  = isColor ? 600 : fw;
          let st = 'margin:' + mtop(tMul) + 'px 0 ' + mbot(bMul) + 'px;' +
            'font-family:' + c.headFont + ';font-size:' + fs + 'px;font-weight:' + wt + ';line-height:1.5;' +
            'color:' + col + ';letter-spacing:.4px;word-break:break-word;' +
            (isColor ? 'text-align:center;' : '');
          if (c.hStyle === 'bar'){
            st += 'border-left:4px solid ' + accent + ';' +
                  'margin-left:-4px;' +
                  'padding-left:' + (12 + side) + 'px;' +
                  (side ? 'padding-right:' + side + 'px;' : '');
          } else {
            st += pad;
          }
          el.setAttribute('style', st);
          break;
        }

        case 'BLOCKQUOTE':
          el.setAttribute('style',
            'margin:' + mtop(1.4) + 'px 0 ' + mbot(1.4) + 'px;' +
            'padding:14px ' + (18 + side) + 'px 14px ' + (18 + side) + 'px;' +
            'background:' + c.soft + ';border-left:3px solid ' + accent + ';' +
            'border-radius:0 6px 6px 0;font-family:' + c.font + ';' +
            'font-weight:' + c.weight + ';' +
            'font-size:' + (c.fs - 1) + 'px;line-height:' + c.lh + ';' +
            'letter-spacing:' + c.ls + 'em;color:' + c.text2 + ';word-break:break-word;');
          $$('p', el).forEach(p => p.setAttribute('style', 'margin:0 0 .6em;font-size:inherit;font-weight:inherit;color:inherit;line-height:inherit;'));
          break;

        case 'UL': case 'OL':
          el.setAttribute('style', 'margin:' + mtop(1) + 'px 0 ' + mbot(1) + 'px;' +
            'padding-left:' + (side + 24) + 'px;' +
            (side ? 'padding-right:' + side + 'px;' : '') +
            'font-family:' + c.font + ';font-size:' + c.fs + 'px;' +
            'font-weight:' + c.weight + ';color:' + c.text + ';');
          break;

        case 'LI':
          el.setAttribute('style', 'margin:0 0 ' + mbot(.5) + 'px;' +
            'font-family:' + c.font + ';font-size:' + c.fs + 'px;' +
            'font-weight:' + c.weight + ';' +
            'line-height:' + c.lh + ';' +
            'letter-spacing:' + c.ls + 'em;color:' + c.text + ';word-break:break-word;');
          break;

        case 'IMG':
          // 兜底：正常流程里图片会被包进 figure，这里只在异常结构下生效
          el.setAttribute('style', 'max-width:100%;height:auto;display:block;' +
            'margin:' + mtop(1.5) + 'px ' + side + 'px ' + mbot(1.5) + 'px;' +
            'border-radius:' + radiusOf(el) + 'px;');
          el.setAttribute('draggable', 'false');
          el.removeAttribute('width'); el.removeAttribute('height');
          break;

        case 'PRE':
          el.setAttribute('style', 'margin:' + mtop(1.4) + 'px ' + side + 'px ' + mbot(1.4) + 'px;' +
            'padding:16px ' + (16 + side) + 'px;overflow:auto;' +
            'background:#1f2430;color:#e4e6eb;border-radius:8px;' +
            'font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;' +
            'white-space:pre-wrap;word-break:break-word;');
          break;

        case 'CODE':
          if (el.parentElement && el.parentElement.tagName === 'PRE'){
            el.setAttribute('style', 'background:none;color:inherit;padding:0;font:inherit;');
          } else {
            el.setAttribute('style', 'font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;' +
              'background:' + c.codeBg + ';color:' + userColor(el, accent) + ';padding:2px 5px;border-radius:4px;');
          }
          break;

        case 'A':
          el.setAttribute('style', 'color:' + userColor(el, accent) + ';text-decoration:none;' +
            'border-bottom:1px solid rgba(120,120,130,.35);');
          break;

        case 'STRONG': case 'B':
          el.setAttribute('style', 'font-weight:600;color:' + userColor(el, head) + ';');
          break;

        case 'EM': case 'I':
          el.setAttribute('style', 'font-style:italic;');
          break;

        case 'U':
          el.setAttribute('style', 'text-decoration:underline;text-underline-offset:2px;');
          break;

        case 'S': case 'DEL': case 'STRIKE':
          el.setAttribute('style', 'text-decoration:line-through;opacity:.65;');
          break;

        case 'MARK':
          el.setAttribute('style', 'background:#fdf0a4;color:inherit;padding:0 2px;border-radius:3px;');
          break;

        case 'TABLE':
          el.setAttribute('style',
            'border-collapse:collapse;margin:' + mtop(1) + 'px ' + side + 'px ' + mbot(1) + 'px;' +
            'width:' + (side ? 'calc(100% - ' + (side * 2) + 'px)' : '100%') + ';' +
            'font-family:' + c.font + ';font-size:' + (c.fs - 1) + 'px;color:' + c.text + ';');
          break;

        case 'TD':
          el.setAttribute('style', 'border:1px solid ' + c.hairline + ';padding:8px 10px;' +
            'text-align:left;line-height:1.6;word-break:break-word;');
          break;

        case 'TH':
          el.setAttribute('style', 'border:1px solid ' + c.hairline + ';padding:8px 10px;text-align:left;' +
            'background:' + c.tableBg + ';font-weight:600;color:' + head + ';line-height:1.6;word-break:break-word;');
          break;

        default:
          break;
      }
    });
  }

  /* ======================================================================
     6b. 滑动图集：横向滚动条 + 左右滑动提示
         公众号支持 overflow-x 滚动容器，这是通用的"左右滑动查看"做法
     ====================================================================== */
  const HINT_TEXT = '‹ 左右滑动查看下一张 ›';

  /* 每张图可单独设圆角，存在 data-radius 上 */
  function radiusOf(img){
    const r = parseInt(img.getAttribute('data-radius'), 10);
    return isNaN(r) ? 6 : r;
  }

  /* 图片显示宽度（百分比）。默认 100 即占满正文宽度 */
  const WIDTH_STEPS = [100, 75, 50, 33];
  function widthOf(img){
    const w = parseInt(img.getAttribute('data-width'), 10);
    return (isNaN(w) || w < 20 || w > 100) ? 100 : w;
  }
  function nextWidth(w){
    const i = WIDTH_STEPS.indexOf(w);
    return WIDTH_STEPS[(i + 1) % WIDTH_STEPS.length];
  }

  const sidePad = c => (c.side ? 'padding-left:' + c.side + 'px;padding-right:' + c.side + 'px;' : '');

  /* 段前距 / 段后距：上边距 = 段前距 + 原倍数 × 段后距，下边距 = 原倍数 × 段后距 */
  const gapTop = (c, m) => Math.round((c.spBefore || 0) + (c.spAfter || 0) * m);
  const gapBot = (c, m) => Math.round((c.spAfter || 0) * m);

  function capStyle(c, width){
    const w = width || 100;
    return 'margin-top:8px;text-align:center;font-family:' + c.font + ';font-size:12px;line-height:1.6;' +
           'letter-spacing:.2px;color:' + c.cap + ';' +
           (w < 100 ? 'width:' + w + '%;margin-left:auto;margin-right:auto;' : '');
  }

  function applyCap(cap, c, width){
    if (!cap) return;
    cap.setAttribute('style', (cap.textContent || '').trim() ? capStyle(c, width) : 'display:none;');
  }

  function styleFigure(fig, c){
    const img = fig.querySelector('img');
    if (!img){ fig.remove(); return; }
    const w = widthOf(img);
    fig.setAttribute('style', 'margin:' + gapTop(c, 1.5) + 'px 0 ' + gapBot(c, 1.5) + 'px;' + sidePad(c));
    img.setAttribute('draggable', 'false');
    img.setAttribute('style',
      'max-width:100%;width:' + w + '%;height:auto;display:block;margin:0 auto;' +
      'border-radius:' + radiusOf(img) + 'px;');
    // 图注跟图片同宽居中：小图配一条通栏文字会很难看
    applyCap(fig.querySelector('[data-jp="cap"]'), c, w);
  }

  function styleGallery(fig, c){
    const imgs = Array.from(fig.querySelectorAll('img'));
    if (!imgs.length){ fig.remove(); return; }              // 图被删光就把壳也删掉

    const strip = fig.querySelector('[data-jp="strip"]');
    const hint  = fig.querySelector('[data-jp="hint"]');
    const cells = Array.from(fig.querySelectorAll('[data-jp="cell"]'));
    const single = imgs.length < 2;

    fig.setAttribute('style', 'margin:' + gapTop(c, 1.6) + 'px 0 ' + gapBot(c, 1.6) + 'px;' + sidePad(c));

    if (strip){
      strip.setAttribute('style', single
        ? 'font-size:0;text-align:center;'
        : 'overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;' +
          'white-space:nowrap;scroll-snap-type:x proximity;font-size:0;');
    }

    cells.forEach(cell => {
      cell.setAttribute('style', single
        ? 'display:block;width:100%;max-width:100%;margin:0;white-space:normal;'
        : 'display:inline-block;vertical-align:top;width:84%;max-width:84%;margin:0 8px 0 0;' +
          'white-space:normal;scroll-snap-align:start;');
    });

    imgs.forEach(img => {
      img.setAttribute('draggable', 'false');
      img.setAttribute('style',
        'display:block;width:100%;max-width:100%;height:auto;margin:0;' +
        'border-radius:' + radiusOf(img) + 'px;');
      const cell = img.closest('[data-jp="cell"]');
      applyCap(cell && cell.querySelector('[data-jp="cap"]'), c);
    });

    if (hint){
      hint.setAttribute('style', single
        ? 'display:none;'
        : 'margin-top:10px;text-align:center;font-size:11px;line-height:1;' +
          'letter-spacing:3px;color:' + c.faint + ';');
      if (!single) hint.textContent = HINT_TEXT;             // 复制出去的始终是静态提示
    }
  }

  function capEl(){
    const el = document.createElement('section');
    el.setAttribute('data-jp', 'cap');
    return el;
  }

  /* 把图片整理进可承载图注的容器：单图 → figure，图集 → cell */
  function normalizeImages(root){
    // 1) 只有一张图、没有文字的段落 → 升级成 figure
    $$('p', root).forEach(p => {
      if (p.parentNode !== root) return;
      if (p.textContent.trim() || p.querySelector('[data-jp]')) return;
      const imgs = Array.from(p.querySelectorAll('img'));
      if (imgs.length !== 1) return;
      if (imgs[0].parentNode !== p) return;      // 被 <a> 等包裹时保持原样，不破坏链接
      const fig = document.createElement('figure');
      fig.setAttribute('data-jp', 'figure');
      p.replaceWith(fig);
      fig.appendChild(imgs[0]);
      fig.appendChild(capEl());
    });

    // 2) 图集里每张图包进 cell
    $$('[data-jp="strip"]', root).forEach(strip => {
      const strays = [];
      Array.from(strip.childNodes).forEach(node => {
        if (node.nodeType === 1 && node.tagName === 'IMG'){
          const cell = document.createElement('section');
          cell.setAttribute('data-jp', 'cell');
          node.replaceWith(cell);
          cell.appendChild(node);
          cell.appendChild(capEl());
          return;
        }
        if (node.nodeType === 1 && node.getAttribute('data-jp') === 'cell'){
          const im = node.querySelector('img');
          // 图被删掉了：格子要一起清掉，否则原位置会空占一格，
          // 看上去就是"删了一张，那里还是显示有多张"
          if (!im){ node.remove(); return; }
          if (node.firstChild !== im) node.insertBefore(im, node.firstChild);
          if (!node.querySelector('[data-jp="cap"]')) node.appendChild(capEl());
          return;
        }
        strays.push(node);        // 用户写进来的文字，交给第 3 步挪出去
      });
      evictStrays(strip, strays);
    });

    // 3) figure / cell 里除了 img 和 cap 以外的内容也挪出去
    $$('[data-jp="figure"], [data-jp="cell"]', root).forEach(host => {
      const strays = [];
      Array.from(host.childNodes).forEach(node => {
        if (node.nodeType === 1 && (node.tagName === 'IMG' || node.getAttribute('data-jp') === 'cap')) return;
        strays.push(node);
      });
      evictStrays(host, strays);
    });
  }

  /* 把误落进图片容器里的内容挪到图外变成正常段落。
     绝不静默删除用户写的字——那正是"图片上方的文字排版后消失"的根源。 */
  function evictStrays(host, nodes){
    if (!nodes.length) return;

    const keep = [];
    nodes.forEach(n => {
      if ((n.textContent || '').trim()) keep.push(n);
      else n.remove();                                  // 纯空白节点清掉
    });
    if (!keep.length) return;

    const fig = (host.closest && host.closest('[data-jp]')) || host;
    const parent = fig.parentNode;

    // 认一下这些内容原本在图的上面还是下面，挪出去后保持相对位置
    const anchor = host.querySelector('img, [data-jp="cap"]');
    const after = !!(anchor && (anchor.compareDocumentPosition(keep[0]) & 4));  // DOCUMENT_POSITION_FOLLOWING

    const p = document.createElement('p');
    keep.forEach(n => p.appendChild(n));

    if (!parent){ keep.forEach(n => n.remove()); return; }
    if (after) fig.after(p);
    else parent.insertBefore(p, fig);
  }

  /* 图集里空掉的格子要清掉。键盘 Delete 删图不经过工具条，
     所以这里在输入事件里顺手兜一下。 */
  function cleanEmptyCells(){
    let touched = false;
    $$('[data-jp="strip"]', editor).forEach(strip => {
      Array.from(strip.querySelectorAll('[data-jp="cell"]')).forEach(cell => {
        if (!cell.querySelector('img')){ cell.remove(); touched = true; }
      });
      if (!strip.querySelector('img')){
        const fig = strip.closest('[data-jp="gallery"]');
        if (fig){ fig.remove(); touched = true; }
      }
    });
    if (touched) bake(true);
    return touched;
  }

  /* 首尾保证有可输入的文本块，否则光标落不到图片上方 */
  const TYPEABLE = /^(P|H1|H2|H3|H4|H5|H6|BLOCKQUOTE|UL|OL|PRE|DIV|ADDRESS|DD)$/;

  function emptyP(){
    const p = document.createElement('p');
    p.appendChild(document.createElement('br'));
    return p;
  }

  function ensureEdges(){
    const first = editor.firstElementChild;
    if (first && !TYPEABLE.test(first.tagName)) editor.insertBefore(emptyP(), first);
    const last = editor.lastElementChild;
    if (last && !TYPEABLE.test(last.tagName)) editor.appendChild(emptyP());
  }

  /* 找到（或补上）图片所在的可加图注容器 */
  function captionHost(img){
    const host = img.closest('[data-jp="figure"],[data-jp="cell"]');
    if (!host) return null;
    let cap = host.querySelector('[data-jp="cap"]');
    if (!cap){ cap = capEl(); host.appendChild(cap); }
    return { host, cap };
  }

  function buildGallery(items){
    const fig = document.createElement('figure');
    fig.setAttribute('data-jp', 'gallery');

    const strip = document.createElement('section');
    strip.setAttribute('data-jp', 'strip');
    items.forEach(it => {
      const cell = document.createElement('section');
      cell.setAttribute('data-jp', 'cell');
      const img = document.createElement('img');
      img.src = it.src;
      if (it.alt) img.alt = it.alt;
      img.setAttribute('draggable', 'false');
      cell.appendChild(img);
      cell.appendChild(capEl());
      strip.appendChild(cell);
    });

    const hint = document.createElement('section');
    hint.setAttribute('data-jp', 'hint');
    hint.textContent = HINT_TEXT;

    fig.appendChild(strip);
    fig.appendChild(hint);
    return fig;
  }

  /* ======================================================================
     6c. 图片：选中 / 图注 / 圆角 / 替换 / 裁剪
     ====================================================================== */
  function selectImage(img){
    if (!img || !editor.contains(img)){ hideImgUI(); return; }
    selectedImg = img;
    const host = captionHost(img);
    capInput.value = host ? (host.cap.textContent || '') : '';

    // 尺寸按钮：图集里的图由格子控宽，单图才需要这个
    const sizeBtn = $('#sizeBtn');
    if (sizeBtn){
      const inGallery = !!img.closest('[data-jp="strip"]');
      sizeBtn.style.display = inGallery ? 'none' : '';
      if (!inGallery) sizeBtn.textContent = '大小 ' + widthOf(img) + '%';
    }

    imgbar.classList.add('on');
    layoutImgUI();
  }

  function hideImgUI(){
    selectedImg = null;
    imgbar.classList.remove('on');
    imgHalo.style.display = 'none';
  }

  function layoutImgUI(){
    if (!selectedImg || !editor.contains(selectedImg)){ hideImgUI(); return; }
    const cr = canvas.getBoundingClientRect();
    const strip = selectedImg.closest('[data-jp="strip"]');

    if (strip){
      // 图集里的图：不做光圈（会被裁切），工具条挂在整个图集下方
      imgHalo.style.display = 'none';
      const fr = (strip.closest('[data-jp="gallery"]') || strip).getBoundingClientRect();
      placeBar(fr.right - cr.left, fr.bottom - cr.top, cr);
      return;
    }

    const ir = selectedImg.getBoundingClientRect();
    imgHalo.style.display = 'block';
    imgHalo.style.left   = (ir.left - cr.left) + 'px';
    imgHalo.style.top    = (ir.top - cr.top) + 'px';
    imgHalo.style.width  = ir.width + 'px';
    imgHalo.style.height = ir.height + 'px';
    placeBar(ir.right - cr.left, ir.bottom - cr.top, cr);
  }

  function placeBar(rightX, bottomY, cr){
    const w = imgbar.offsetWidth || 380;
    imgbar.style.left = clamp(rightX - w, 8, Math.max(8, cr.width - w - 8)) + 'px';
    imgbar.style.top  = (bottomY + 10) + 'px';
  }

  editor.addEventListener('mousedown', () => { pendingSel = null; });
  editor.addEventListener('click', e => {
    const img = e.target.closest ? e.target.closest('img') : null;
    if (img && editor.contains(img)) selectImage(img);
    else hideImgUI();
  });

  window.addEventListener('resize', () => { if (selectedImg) layoutImgUI(); });

  capInput.addEventListener('input', () => {
    if (!selectedImg) return;
    const host = captionHost(selectedImg);
    if (!host) return;
    host.cap.textContent = capInput.value;
    // 图注宽度要跟着图片走，否则打字时图注会突然变回通栏
    applyCap(host.cap, cfg(), widthOf(selectedImg));
    scheduleSave();
    scheduleHistory();
  });
  capInput.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ capInput.blur(); hideImgUI(); }
  });

  imgbar.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn || !selectedImg) return;
    const img = selectedImg;
    const act = btn.dataset.act;

    if (act === 'crop'){ openCrop(img); }

    else if (act === 'size'){
      const w = nextWidth(widthOf(img));
      if (w === 100) img.removeAttribute('data-width');
      else img.setAttribute('data-width', String(w));
      bake(true);
      selectImage(img);
      toast(w === 100 ? '图片恢复整幅宽度' : '图片宽度 ' + w + '%（居中，图注同宽）');
    }

    else if (act === 'round'){
      const seq = [6, 0, 12, 24];
      const cur = radiusOf(img);
      const next = seq[(seq.indexOf(cur) + 1) % seq.length];
      img.setAttribute('data-radius', String(next));
      toast(next === 0 ? '已改为直角' : '圆角 ' + next + 'px');
      bake(true);
      selectImage(img);
    }
    else if (act === 'replace'){ pickerMode = 'replace'; fileInput.click(); }
    else if (act === 'del'){ hideImgUI(); img.remove(); bake(true); toast('已删除图片'); }
  });

  /* ---------- 裁剪弹窗 ---------- */
  let cropState = null;

  function stageSize(){
    const r = cropImg.getBoundingClientRect();
    return { w: r.width, h: r.height };
  }

  function paintCropBox(){
    const st = cropState; if (!st || !st.box) return;
    const b = st.box, s = stageSize();
    cropBox.style.left = b.x + 'px';
    cropBox.style.top = b.y + 'px';
    cropBox.style.width = b.w + 'px';
    cropBox.style.height = b.h + 'px';
    const nat = st.nat;
    const out = $('#cropOut');
    if (out && s.w && nat.w){
      out.textContent = '输出 ' + Math.round(b.w * nat.w / s.w) + ' × ' + Math.round(b.h * nat.h / s.h);
    }
  }

  function resetCropBox(scale){
    const st = cropState; if (!st) return;
    const s = stageSize();
    if (!s.w || !s.h) return;
    let w = s.w * scale, h = s.h * scale;
    if (st.ratio){
      if (w / st.ratio > h) w = h * st.ratio; else h = w / st.ratio;
    }
    st.box = { x: (s.w - w) / 2, y: (s.h - h) / 2, w, h };
    paintCropBox();
  }

  function setCropRatio(ratio, chip){
    if (!cropState) return;
    cropState.ratio = ratio;
    $$('#cropRatios .chip').forEach(x => x.classList.toggle('on', x === chip));
    resetCropBox(0.82);
  }

  function openCrop(img){
    cropState = { target: img, ratio: null, box: null, drag: null, nat: { w: 0, h: 0 } };
    cropMask.classList.add('on');

    const ready = () => {
      if (!cropState) return;
      cropState.nat = { w: cropImg.naturalWidth, h: cropImg.naturalHeight };
      setCropRatio(null, $('#cropRatios .chip[data-ratio="free"]'));
    };
    cropImg.onload = ready;
    cropImg.src = img.src;
    if (cropImg.complete && cropImg.naturalWidth) ready();
  }

  function closeCrop(){
    cropMask.classList.remove('on');
    cropImg.removeAttribute('src');
    cropState = null;
  }

  $('#cropRatios').addEventListener('click', e => {
    const chip = e.target.closest('[data-ratio]');
    if (!chip || !cropState) return;
    const v = chip.dataset.ratio;
    const ratio = v === 'free' ? null : (() => {
      const p = v.split(':').map(Number);
      return p[0] / p[1];
    })();
    setCropRatio(ratio, chip);
  });

  cropStage.addEventListener('pointerdown', e => {
    if (!cropState || !cropState.box) return;
    const s = stageSize();
    const r = cropStage.getBoundingClientRect();
    const pt = { x: clamp(e.clientX - r.left, 0, s.w), y: clamp(e.clientY - r.top, 0, s.h) };
    const box = cropState.box;
    const handle = e.target.getAttribute && e.target.getAttribute('data-h');

    if (handle){
      const anchor = {
        nw: { x: box.x + box.w, y: box.y + box.h },
        ne: { x: box.x,        y: box.y + box.h },
        sw: { x: box.x + box.w, y: box.y },
        se: { x: box.x,        y: box.y }
      }[handle];
      cropState.drag = { mode: 'resize', anchor };
    } else {
      cropState.drag = { mode: 'move', dx: pt.x - box.x, dy: pt.y - box.y };
    }
    if (cropStage.setPointerCapture) cropStage.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  cropStage.addEventListener('pointermove', e => {
    const st = cropState;
    if (!st || !st.drag || !st.box) return;
    const s = stageSize();
    const r = cropStage.getBoundingClientRect();
    const pt = { x: clamp(e.clientX - r.left, 0, s.w), y: clamp(e.clientY - r.top, 0, s.h) };
    const box = st.box;

    if (st.drag.mode === 'move'){
      box.x = clamp(pt.x - st.drag.dx, 0, s.w - box.w);
      box.y = clamp(pt.y - st.drag.dy, 0, s.h - box.h);
    } else {
      const a = st.drag.anchor;
      const sx = pt.x < a.x ? -1 : 1;
      const sy = pt.y < a.y ? -1 : 1;
      const maxW = sx > 0 ? s.w - a.x : a.x;
      const maxH = sy > 0 ? s.h - a.y : a.y;
      let w = Math.abs(pt.x - a.x), h = Math.abs(pt.y - a.y);

      if (st.ratio){
        if (w / st.ratio >= h) h = w / st.ratio; else w = h * st.ratio;
        w = Math.min(w, maxW);
        h = w / st.ratio;
        if (h > maxH){ h = maxH; w = h * st.ratio; }
      } else {
        w = Math.min(w, maxW);
        h = Math.min(h, maxH);
      }
      if (w < 24 || h < 24) return;

      box.w = w; box.h = h;
      box.x = sx > 0 ? a.x : a.x - w;
      box.y = sy > 0 ? a.y : a.y - h;
    }
    paintCropBox();
    e.preventDefault();
  });

  const endCropDrag = () => { if (cropState) cropState.drag = null; };
  cropStage.addEventListener('pointerup', endCropDrag);
  cropStage.addEventListener('pointercancel', endCropDrag);

  $('#cropOk').addEventListener('click', () => {
    const st = cropState;
    if (!st || !st.box) return;
    const s = stageSize();
    const nat = st.nat;
    if (!s.w || !nat.w) return;

    const sx = Math.max(0, Math.round(st.box.x * nat.w / s.w));
    const sy = Math.max(0, Math.round(st.box.y * nat.h / s.h));
    const sw = Math.max(1, Math.round(st.box.w * nat.w / s.w));
    const sh = Math.max(1, Math.round(st.box.h * nat.h / s.h));

    const cvs = document.createElement('canvas');
    cvs.width = sw; cvs.height = sh;
    const ctx = cvs.getContext('2d');
    let url;
    try {
      ctx.drawImage(cropImg, sx, sy, sw, sh, 0, 0, sw, sh);
      const keepAlpha = /^data:image\/(png|gif|webp|svg)/i.test(st.target.src);
      url = cvs.toDataURL(keepAlpha ? 'image/png' : 'image/jpeg', 0.92);
    } catch (err) {
      toast('外链图片跨域无法裁剪，请先保存到本地再插入');
      return;
    }

    const target = st.target;
    target.src = url;
    target.removeAttribute('width');
    target.removeAttribute('height');
    closeCrop();
    bake(true);
    selectImage(target);
    toast('已裁剪为 ' + sw + ' × ' + sh);
  });

  /* 把新块插到光标所在块之后，并留一个空段落方便接着写。
     注意：绝不能先 editor.focus() 再读选区——弹窗/文件框会把光标弄丢，
     focus() 又会把光标丢到编辑器开头，表格就会跑到第一段。 */
  function insertBlockNode(node){
    let anchor = null;

    if (pendingSel){                              // 打开弹窗/选文件之前存下的位置优先
      restoreSelection(pendingSel);
      pendingSel = null;
      const s1 = window.getSelection();
      if (s1.rangeCount && editor.contains(s1.anchorNode)) anchor = blockOf(s1.anchorNode);
    }
    if (!anchor){
      const s2 = window.getSelection();
      if (s2.rangeCount && editor.contains(s2.anchorNode)) anchor = blockOf(s2.anchorNode);
    }
    if (!anchor){
      const last = editor.lastElementChild;       // 兜底放末尾，绝不放开头
      if (last && last.parentNode === editor) anchor = last;
    }

    const isEmptyP = anchor && anchor.tagName === 'P' &&
      !anchor.textContent.trim() && !anchor.querySelector('img,table,figure');

    if (isEmptyP) anchor.replaceWith(node);
    else if (anchor && anchor.parentNode === editor) anchor.after(node);
    else editor.appendChild(node);

    const tail = document.createElement('p');
    tail.appendChild(document.createElement('br'));
    node.after(tail);
    placeCaret(tail);
    bake(true);
  }

  /* ======================================================================
     6f. 插图前压缩
         base64 直接塞进正文有几个致命问题：data URL 太长浏览器会加载不出
         （图就"不显示"）、localStorage 只有 5MB 很快撑爆导致静默存不上。
         所以插入前统一压到长边 1600、重编码为 JPEG。
     ====================================================================== */
  const IMG_MAX_SIDE  = 1600;          // 长边上限
  const IMG_QUALITY   = 0.85;          // JPEG 质量
  const IMG_KEEP      = 260 * 1024;    // 原图比这还小且尺寸不超限，就原样保留

  const dataURLBytes = s => Math.round(Math.max(0, s.length - s.indexOf(',') - 1) * 3 / 4);
  const fmtBytes = n => n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB'
                    : n >= 1024    ? Math.round(n / 1024) + 'KB'
                    : n + 'B';

  function readAsDataURL(file, cb){
    const r = new FileReader();
    r.onload = e => cb(e.target.result);
    r.onerror = () => cb(null);
    r.readAsDataURL(file);
  }

  /* 嗅一下 data URL 里有没有"非 sRGB"的 ICC 色彩配置。
     iPhone 照片常见 Display P3，HDR 的是 BT.2020 PQ —— 前者在浏览器/公众号
     之间处理不一致，后者（PQ）浏览器基本解不对，颜色都会偏。
     canvas 重编码出来的固定是 sRGB，所以嗅到非 sRGB 就强制走一遍。 */
  function dataUrlHasNonSrgbIcc(src){
    try {
      const comma = src.indexOf(',');
      if (comma < 0 || src.slice(0, comma).indexOf('base64') < 0) return false;
      const b64 = src.slice(comma + 1, comma + 1 + 262144).replace(/[^A-Za-z0-9+/]/g, '');
      const bin = atob(b64.slice(0, b64.length - (b64.length % 4)));
      const at = bin.indexOf('ICC_PROFILE');
      if (at < 0) return false;                       // 没有配置就是 sRGB，不用管
      return !/sRGB/i.test(bin.slice(at, at + 4096)); // 描述里没写 sRGB → 广色域
    } catch (e) { return false; }
  }

  /* 把任意 data URL 压小；失败就原样返回，绝不把图弄丢。
     force=true 时即使压不小也重编码（用来做色彩归一化）。 */
  function compressDataURL(src, cb, force){
    if (!src || !/^data:image\//i.test(src)){ cb(null); return; }
    const before = dataURLBytes(src);
    if (!/^data:image\/(png|jpe?g|gif|webp|bmp)/i.test(src)){ cb({ src, before, after: before, kept: true }); return; }

    // 兜底：万一 onload/onerror 都不触发（环境不支持解码），也要把图插进去，
    // 绝不能因为"压缩失败"把用户的图弄丢
    let settled = false;
    const done = info => { if (settled) return; settled = true; clearTimeout(timer); cb(info); };
    const timer = setTimeout(() => done({ src, before, after: before, kept: true }), 2500);

    const im = new Image();
    im.onerror = () => done({ src, before, after: before, kept: true });
    im.onload = () => {
      const w0 = im.naturalWidth, h0 = im.naturalHeight;
      if (!w0 || !h0){ done({ src, before, after: before, kept: true }); return; }

      const scale = Math.min(1, IMG_MAX_SIDE / Math.max(w0, h0));
      if (!force && scale === 1 && before <= IMG_KEEP){ done({ src, before, after: before, kept: true }); return; }

      try {
        const w = Math.max(1, Math.round(w0 * scale));
        const h = Math.max(1, Math.round(h0 * scale));
        const cvs = document.createElement('canvas');
        cvs.width = w; cvs.height = h;
        const ctx = cvs.getContext('2d');
        ctx.drawImage(im, 0, 0, w, h);

        // 有透明像素就用 PNG，否则用 JPEG（小一个数量级）
        let alpha = false;
        if (/^data:image\/(png|gif|webp)/i.test(src) && w * h <= 12e6){
          const d = ctx.getImageData(0, 0, w, h).data;
          for (let i = 3; i < d.length; i += 4){ if (d[i] < 250){ alpha = true; break; } }
        }
        const out = alpha ? cvs.toDataURL('image/png')
                          : cvs.toDataURL('image/jpeg', IMG_QUALITY);
        const after = dataURLBytes(out);
        if (!out || (!force && after >= before)){ done({ src, before, after: before, kept: true }); return; }
        done({ src: out, before, after, kept: false, converted: !!force, from: w0 + '×' + h0, to: w + '×' + h });
      } catch (e) {
        done({ src, before, after: before, kept: true });      // 跨域/内存不足都退回原图
      }
    };
    im.src = src;
  }

  /* 浏览器能原生显示的格式 → 直接插入，压缩放后台。
     其它格式（HEIC 是最常见的）→ 必须先解码转成 JPEG，否则插进去
     就是一张浏览器渲染不出来的图，用户只能看到一片空白。 */
  const WEB_SAFE_IMG = /^image\/(png|jpe?g|gif|webp|bmp|avif|svg\+xml)$/i;
  const looksHeic = f => /hei[cf]/i.test(f.type || '') || /\.(heic|heif)$/i.test(f.name || '');

  let exoticWarned = false;
  function warnExotic(name){
    if (exoticWarned) return;
    exoticWarned = true;
    toast('「' + (name || '这张图') + '」解不了。iPhone 的 HEIC 需要联网加载解码器；' +
          '若无法联网，可用「预览」另存为 JPEG，或在 Safari 里打开本页（Safari 自带 HEIC 解码）', 10000);
  }

  /* ---------- HEIC 解码器：只在真的选了 HEIC 时才去下载 ----------
     Chrome 自己不支持 HEIC，浏览器里要解只能靠 libheif（WASM）。
     两个打包版都是 `var libheif = ...` 的 UMD，普通 script 标签即可加载，
     不受 file:// 下 ES module 跨域限制。离线或加载失败会退回明确提示。 */
  const HEIC_CDN = [
    'https://cdn.jsdelivr.net/npm/libheif-js@1.19.8/libheif-wasm/libheif-bundle.js',
    'https://unpkg.com/libheif-js@1.19.8/libheif-wasm/libheif-bundle.js'
  ];
  let heicLibPromise = null;

  function loadHeicLib(){
    if (heicLibPromise) return heicLibPromise;
    heicLibPromise = new Promise((resolve, reject) => {
      let i = 0, done = false;
      const finish = ok => { if (done) return; done = true; ok ? resolve(window.libheif) : reject(new Error('no libheif')); };
      const tryNext = () => {
        if (window.libheif){ finish(true); return; }
        if (i >= HEIC_CDN.length){ finish(false); return; }
        const s = document.createElement('script');
        s.src = HEIC_CDN[i++];
        s.onload = () => window.libheif ? finish(true) : tryNext();
        s.onerror = tryNext;
        document.head.appendChild(s);
      };
      tryNext();
      setTimeout(() => finish(!!window.libheif), 12000);   // 等太久用户会以为卡死
    });
    // 加载失败要清掉缓存，否则一次离线就永远不再重试，只能刷新页面
    heicLibPromise = heicLibPromise.catch(err => { heicLibPromise = null; throw err; });
    return heicLibPromise;
  }

  function decodeHeicToDataURL(file, cb){
    toast('正在加载 HEIC 解码器…（首次需要联网）');
    loadHeicLib().then(libheif => {
      const fr = new FileReader();
      fr.onerror = () => cb(null);
      fr.onload = () => {
        try {
          const imgs = new libheif.HeifDecoder().decode(new Uint8Array(fr.result));
          if (!imgs || !imgs.length) throw new Error('no frame');
          const im = imgs[0];
          const w0 = im.get_width(), h0 = im.get_height();
          if (!w0 || !h0) throw new Error('no size');
          const target = { data: new Uint8ClampedArray(w0 * h0 * 4), width: w0, height: h0 };
          im.display(target, out => {
            try {
              if (!out) throw new Error('display failed');
              const full = document.createElement('canvas');
              full.width = w0; full.height = h0;
              const fctx = full.getContext('2d');
              const id = fctx.createImageData(w0, h0);
              id.data.set(out.data);
              fctx.putImageData(id, 0, 0);

              const scale = Math.min(1, IMG_MAX_SIDE / Math.max(w0, h0));
              let src;
              if (scale < 1){
                const small = document.createElement('canvas');
                small.width = Math.max(1, Math.round(w0 * scale));
                small.height = Math.max(1, Math.round(h0 * scale));
                small.getContext('2d').drawImage(full, 0, 0, small.width, small.height);
                src = small.toDataURL('image/jpeg', 0.88);
              } else {
                src = full.toDataURL('image/jpeg', 0.88);
              }
              if (!src || src.length < 200) throw new Error('encode');
              cb({ src, alt: file.name || '', before: file.size || 0, after: dataURLBytes(src) });
            } catch (e) { cb(null); }
          });
        } catch (e) { cb(null); }
      };
      fr.readAsArrayBuffer(file);
    }).catch(() => cb(null));
  }

  /* 解码 → 缩放 → 统一转成 JPEG，用于浏览器原生显示不了的格式 */
  function convertToWebImage(file, cb){
    readAsDataURL(file, src => {
      if (!src){ cb(null); return; }
      let settled = false, imTimer = null;
      const done = info => {
        if (settled) return;
        settled = true;
        clearTimeout(imTimer); clearTimeout(hardTimer);
        cb(info);
      };
      const hardTimer = setTimeout(() => done(null), 30000);

      /* 浏览器自己解不出来时：如果是 HEIC，交给在线解码器再试一次 */
      const viaDecoder = () => {
        if (settled) return;
        if (looksHeic(file)) decodeHeicToDataURL(file, done);
        else done(null);
      };

      const im = new Image();
      im.onerror = () => { clearTimeout(imTimer); viaDecoder(); };
      im.onload = () => {
        clearTimeout(imTimer);
        try {
          const w0 = im.naturalWidth, h0 = im.naturalHeight;
          if (!w0 || !h0) throw new Error('empty');
          const scale = Math.min(1, IMG_MAX_SIDE / Math.max(w0, h0));
          const w = Math.max(1, Math.round(w0 * scale));
          const h = Math.max(1, Math.round(h0 * scale));
          const cvs = document.createElement('canvas');
          cvs.width = w; cvs.height = h;
          cvs.getContext('2d').drawImage(im, 0, 0, w, h);
          const out = cvs.toDataURL('image/jpeg', 0.9);
          if (!out || out.length < 200) throw new Error('encode');
          done({ src: out, alt: file.name || '', before: dataURLBytes(src), after: dataURLBytes(out) });
        } catch (e) { viaDecoder(); }
      };
      imTimer = setTimeout(viaDecoder, 3000);   // 浏览器 3 秒还没解出来就换解码器
      im.src = src;
    });
  }

  /* 只负责把文件读成 data URL。压缩是后面独立的一步，
     绝不能让"压缩"挡在"插入"前面——那样压缩一失败图就插不进来。 */
  function readImages(files, cb){
    const out = [];
    let left = files.length;
    let failed = 0;
    if (!left){ cb([]); return; }
    files.forEach((file, i) => {
      const done = info => {
        if (info) out[i] = info; else failed++;
        if (--left) return;
        if (failed && !out.filter(Boolean).length) warnExotic(files[0] && files[0].name);
        cb(out.filter(Boolean));
      };
      if (!file){ done(null); return; }
      if (WEB_SAFE_IMG.test(file.type || '') && !looksHeic(file)){
        readAsDataURL(file, src => done(src ? { src, alt: file.name || '' } : null));
      } else {
        convertToWebImage(file, done);      // HEIC 等：转不了就返回 null
      }
    });
  }

  /* 压缩 / 色彩归一化一张已在文中的图片；成功才替换并重排 */
  function shrinkImage(img, quiet){
    const src = img.getAttribute('src') || '';
    if (!/^data:image\//i.test(src)) return;
    const fixColor = dataUrlHasNonSrgbIcc(src);
    compressDataURL(src, info => {
      if (!info || info.kept || !editor.contains(img)) return;
      img.setAttribute('src', info.src);
      img.removeAttribute('width'); img.removeAttribute('height');
      bake(true);
      if (quiet) return;
      toast(info.converted ? '已把图片统一为 sRGB 色彩（原图是广色域，直接显示会偏色）'
                           : '图片已压缩 ' + fmtBytes(info.before) + ' → ' + fmtBytes(info.after));
    }, fixColor);
  }

  /* 压缩容器里所有图片，全部结束后只重排一次 */
  function shrinkImagesIn(rootEl){
    const imgs = Array.from((rootEl || editor).querySelectorAll('img'));
    let left = imgs.length, changed = 0, saved = 0, recolored = 0;
    if (!left) return;
    const finish = () => {
      if (!changed) return;
      bake(true);
      saved = Math.max(0, saved);
      if (recolored && saved > 0) toast('已处理 ' + changed + ' 张：广色域统一为 sRGB，省下 ' + fmtBytes(saved));
      else if (recolored)        toast('已把 ' + recolored + ' 张广色域图片统一为 sRGB（颜色不再偏）');
      else                       toast('已压缩 ' + changed + ' 张，省下 ' + fmtBytes(saved));
    };
    imgs.forEach(img => {
      const src = img.getAttribute('src') || '';
      if (!/^data:image\//i.test(src)){ if (--left === 0) finish(); return; }
      compressDataURL(src, info => {
        if (info && !info.kept && editor.contains(img)){
          img.setAttribute('src', info.src);
          img.removeAttribute('width'); img.removeAttribute('height');
          changed++;
          saved += info.before - info.after;
          if (info.converted) recolored++;
        }
        if (--left === 0) finish();
      }, dataUrlHasNonSrgbIcc(src));
    });
  }

  /* 全量压缩文内已有图片（老稿子里的巨图） */
  function compressAllImages(){
    const imgs = editor.querySelectorAll('img');
    if (!imgs.length){ toast('文里还没有图片'); return; }
    shrinkImagesIn(editor);
  }

  /* ======================================================================
     6d. 插入表格
     ====================================================================== */
  const tblGrid = $('#tblGrid');
  const tblCount = $('#tblCount');
  const tableMask = $('#tableMask');
  let tblSel = { r: 3, c: 3 };

  function buildTableGrid(){
    tblGrid.innerHTML = '';
    for (let r = 1; r <= 6; r++){
      for (let c = 1; c <= 8; c++){
        const cell = document.createElement('i');
        cell.dataset.r = r;
        cell.dataset.c = c;
        tblGrid.appendChild(cell);
      }
    }
  }

  function paintTableGrid(){
    $$('#tblGrid i').forEach(i => {
      i.classList.toggle('on', +i.dataset.r <= tblSel.r && +i.dataset.c <= tblSel.c);
    });
    tblCount.textContent = tblSel.r + ' 行 × ' + tblSel.c + ' 列';
  }

  function openTable(){
    tblSel = { r: 3, c: 3 };
    paintTableGrid();
    tableMask.classList.add('on');
  }
  const closeTable = () => tableMask.classList.remove('on');

  tblGrid.addEventListener('mouseover', e => {
    const i = e.target.closest('i');
    if (!i) return;
    tblSel = { r: +i.dataset.r, c: +i.dataset.c };
    paintTableGrid();
  });

  tblGrid.addEventListener('click', e => {
    const i = e.target.closest('i');
    if (!i) return;
    tblSel = { r: +i.dataset.r, c: +i.dataset.c };
    closeTable();
    insertTable(tblSel.r, tblSel.c);
  });

  function insertTable(rows, cols){
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const hrow = document.createElement('tr');
    for (let c = 0; c < cols; c++){
      const th = document.createElement('th');
      th.appendChild(document.createElement('br'));
      hrow.appendChild(th);
    }
    thead.appendChild(hrow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    for (let r = 1; r < rows; r++){
      const tr = document.createElement('tr');
      for (let c = 0; c < cols; c++){
        const td = document.createElement('td');
        td.appendChild(document.createElement('br'));
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);

    insertBlockNode(table);
    toast('已插入 ' + rows + ' 行 × ' + cols + ' 列表格');
  }

  /* ======================================================================
     6e. 样式模板：把当前一整套排版参数存下来，随时套用
     ====================================================================== */
  const LS_TPL = 'jianpai.templates.v1';
  let templates = [];

  function readState(){
    return {
      customAccent: state.customAccent,
      fs: state.fs, lh: state.lh, ls: state.ls,
      spBefore: state.spBefore, spAfter: state.spAfter, side: state.side,
      font: state.font, hStyle: state.hStyle,
      justify: state.justify, indent: state.indent
    };
  }

  function loadTemplates(){
    try {
      const raw = localStorage.getItem(LS_TPL);
      templates = raw ? (JSON.parse(raw) || []) : [];
      // 旧版本内置的预设模板，这里一并清掉
      templates = templates.filter(t => t && t.id && t.id[0] !== 'b');
      saveTemplates();
    } catch (e) { templates = []; }
    renderTemplates();
  }

  function saveTemplates(){
    try { localStorage.setItem(LS_TPL, JSON.stringify(templates)); } catch (e) {}
  }

  function renderTemplates(){
    const list = $('#tplList');
    if (!templates.length){
      list.innerHTML = '<div class="tpl-empty">还没有模板。调好右侧的样式后，点下面的按钮存一个，之后一键套用。</div>';
      return;
    }
    list.innerHTML = templates.map(t => {
      const color = t.cfg.customAccent || '#1a1a1a';
      const sub = t.cfg.fs + 'px · ' + Number(t.cfg.lh).toFixed(2);
      return '<div class="tpl" data-id="' + t.id + '" title="点击套用这套样式">' +
        '<span class="dot" style="background:' + color + ';"></span>' +
        '<span class="nm">' + esc(t.name) + '</span>' +
        '<span class="sub">' + sub + '</span>' +
        '<button class="x" data-del="' + t.id + '" title="删除模板">×</button>' +
      '</div>';
    }).join('');
  }

  $('#tplList').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del){
      const t = templates.find(x => x.id === del.dataset.del);
      if (t && confirm('删除模板「' + t.name + '」？')){
        templates = templates.filter(x => x.id !== t.id);
        saveTemplates();
        renderTemplates();
        toast('已删除「' + t.name + '」');
      }
      return;
    }
    const item = e.target.closest('.tpl');
    if (!item) return;
    const t = templates.find(x => x.id === item.dataset.id);
    if (!t) return;
    Object.assign(state, migrateState(Object.assign({}, t.cfg)));
    syncControls();
    applyVisual();
    saveCfg();
    scheduleBake();
    $$('#tplList .tpl').forEach(x => x.classList.toggle('on', x === item));
    toast('已套用「' + t.name + '」');
  });



  $('#tplSave').addEventListener('click', () => {
    askText('保存为模板', '给这套样式起个名字', '模板 ' + (templates.length + 1), name => {
      if (!name) return;
      const cfgNow = readState();
      const i = templates.findIndex(t => t.name === name);
      if (i >= 0) templates[i] = { id: templates[i].id, name, cfg: cfgNow };
      else templates.push({ id: 'u' + Date.now().toString(36), name, cfg: cfgNow });
      saveTemplates();
      renderTemplates();
      toast('已保存模板「' + name + '」');
    });
  });

  /* ---------- 通用文本输入弹窗 ---------- */
  const textMask = $('#textMask');
  const textInput = $('#textInput');
  let textCb = null;

  function askText(title, placeholder, value, cb){
    $('#textTitle').textContent = title;
    textInput.placeholder = placeholder || '';
    textInput.value = value || '';
    textCb = cb;
    textMask.classList.add('on');
    setTimeout(() => { textInput.focus(); textInput.select(); }, 30);
  }
  function closeText(){ textMask.classList.remove('on'); textCb = null; }

  $('#textOk').addEventListener('click', () => {
    const v = textInput.value.trim();
    const cb = textCb;
    closeText();
    if (cb) cb(v);
  });
  textInput.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); $('#textOk').click(); }
    if (e.key === 'Escape') closeText();
  });
  [textMask, tableMask, cropMask, linkMask].forEach(mask => {
    mask.addEventListener('click', e => {
      if (e.target === mask || e.target.hasAttribute('data-close')){
        if (mask === cropMask) closeCrop();
        else if (mask === tableMask) closeTable();
        else if (mask === textMask) closeText();
        else closeLink();
      }
    });
  });

  /* ======================================================================
     7. 复制 / 导出
     ====================================================================== */
  /* innerText 能保留换行，缺失时退回 textContent */
  function plainText(el){
    const t = ('innerText' in el) ? el.innerText : el.textContent;
    return (t || '').replace(/\u00a0/g, ' ');
  }

  /* 编辑器为了能落光标会在首尾补空段落，复制/导出时要去掉，别带进公众号 */
  const isBlankBlock = el => !!el && el.tagName === 'P' &&
    !el.textContent.trim() && !el.querySelector('img,figure,table,hr,pre');

  /* 复制/导出前把结构"拍平"成公众号最吃得准的样子。
     公众号会拆掉 figure 这类 HTML5 语义标签，图注的格式会跟着丢，
     所以：
       ① figure → section（只用 section/p/span 这几个它认的）
       ② 图注文字样式挪到内层 span 上，section 只留间距与对齐
     正文段落本来就用 p，一直没事，这里不动它。 */
  const CAP_BLOCK_PROP = /^(margin|width|display|text-align)/i;

  function wechatNormalize(root){
    // ① figure → section
    $$('figure[data-jp]', root).forEach(fig => {   // 只转真正的 figure；section 本就不需要
      const sec = document.createElement('section');
      Array.from(fig.attributes).forEach(a => sec.setAttribute(a.name, a.value));
      while (fig.firstChild) sec.appendChild(fig.firstChild);
      fig.replaceWith(sec);
    });

    // ② 图注：块级样式留 section，视觉样式挪到 span
    $$('[data-jp="cap"]', root).forEach(cap => {
      const txt = (cap.textContent || '').trim();
      if (!txt){ cap.remove(); return; }
      const block = [], inline = [];
      String(cap.getAttribute('style') || '').split(';').forEach(decl => {
        const i = decl.indexOf(':');
        if (i < 0) return;
        const k = decl.slice(0, i).trim(), v = decl.slice(i + 1).trim();
        if (!k || !v) return;
        (CAP_BLOCK_PROP.test(k) ? block : inline).push(k + ':' + v);
      });
      cap.setAttribute('style', block.length ? block.join(';') + ';' : '');
      const span = document.createElement('span');
      span.setAttribute('style', inline.length ? inline.join(';') + ';' : '');
      span.textContent = txt;
      cap.innerHTML = '';
      cap.appendChild(span);
    });

    // ③ 图集里的格子本来就是 section，但里面的图注同样要包 span（上面已处理）
    // ④ span/u/s 这些行内标签也统一成 span，避免公众号自己做归一
    $$('u', root).forEach(el => {
      const sp = document.createElement('span');
      sp.setAttribute('style', 'text-decoration:underline;text-underline-offset:2px;');
      while (el.firstChild) sp.appendChild(el.firstChild);
      el.replaceWith(sp);
    });
    $$('s,del,strike', root).forEach(el => {
      const sp = document.createElement('span');
      sp.setAttribute('style', 'text-decoration:line-through;opacity:.65;');
      while (el.firstChild) sp.appendChild(el.firstChild);
      el.replaceWith(sp);
    });

    // ⑤ 字体挂到行内 span 上
    //    关键：苹方用单值 PostScript 名（PingFangSC-Light），微信只保留这种；
    //    多值带引号的 font-family 会被它整个洗掉。字重编码在名字里，span 只放 font-family。
    //    只处理纯文本节点，已有的 span（用户上色等）不动，避免嵌套出问题。
    const cw = cfg();
    {
      const SKIP = new Set(['PRE','CODE','SCRIPT','STYLE']);
      const HEAD = new Set(['H1','H2','H3','H4','H5','H6','TH']);
      const BLOCKS = 'p,li,h1,h2,h3,h4,h5,h6,blockquote,td,th';
      $$(BLOCKS, root).forEach(block => {
        if (block.closest('[data-jp]') || SKIP.has(block.tagName)) return;
        const fam = HEAD.has(block.tagName) ? cw.headFont : cw.font;
        Array.from(block.childNodes).forEach(node => {
          if (node.nodeType !== 3) return;                 // 只包裸文本
          if (!node.nodeValue.replace(/\u200b/g, '').trim()) return;
          const span = document.createElement('span');
          span.setAttribute('style', 'font-family:' + fam + ';');
          node.replaceWith(span);
          span.appendChild(node);
        });
      });
    }
  }

  function payload(){
    const c = cfg();
    const clone = editor.cloneNode(true);
    while (clone.firstElementChild && isBlankBlock(clone.firstElementChild)) clone.firstElementChild.remove();
    while (clone.lastElementChild  && isBlankBlock(clone.lastElementChild))  clone.lastElementChild.remove();
    wechatNormalize(clone);
    const body = clone.innerHTML;
    return body;
  }

  function copyRich(){
    if (!editor.textContent.trim() && !editor.querySelector('img')){
      toast('还没有内容可以复制'); return;
    }
    bake(true);
    const html = payload();
    const text = plainText(editor);

    const done = () => toast('已复制，去公众号编辑器粘贴吧');
    const fail = () => toast('复制失败，请手动选中后复制');

    // 优先用异步剪贴板写入真正的 text/html，失败再退回 execCommand
    if (navigator.clipboard && typeof navigator.clipboard.write === 'function' && window.ClipboardItem){
      try {
        const item = new ClipboardItem({
          'text/html':  new Blob([html], { type:'text/html' }),
          'text/plain': new Blob([text], { type:'text/plain' })
        });
        navigator.clipboard.write([item]).then(done).catch(() => legacyCopy(html, done, fail));
        return;
      } catch (e) { /* fallthrough */ }
    }
    legacyCopy(html, done, fail);
  }

  function legacyCopy(html, done, fail){
    const holder = document.createElement('div');
    holder.contentEditable = 'true';
    holder.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
    holder.innerHTML = html;
    document.body.appendChild(holder);
    try {
      const range = document.createRange();
      range.selectNodeContents(holder);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      const ok = document.execCommand('copy');
      sel.removeAllRanges();
      holder.remove();
      ok ? done() : fail();
    } catch (e) {
      holder.remove();
      fail();
    }
  }

  /* ======================================================================
     9. 工具栏命令

  function focusEditor(){
    editor.focus();
    if (!window.getSelection().rangeCount){
      const r = document.createRange();
      r.selectNodeContents(editor); r.collapse(false);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    }
  }

  document.getElementById('toolbar').addEventListener('mousedown', e => {
    if (e.target.closest('.tb')) e.preventDefault();   // 不让按钮抢走焦点
  });

  document.getElementById('toolbar').addEventListener('click', e => {
    const btn = e.target.closest('.tb');
    if (!btn) return;

  /* ---------- 块级标签切换（H2 / H3 / 引用）—— 不依赖 execCommand ---------- */

  const SWITCHABLE = /^(P|DIV|H1|H2|H3|H4|H5|H6|BLOCKQUOTE)$/;
  const WRAPPER_IN_BLOCK = /^(P|DIV|SECTION|BLOCKQUOTE|H1|H2|H3|H4|H5|H6)$/;

  /* 找到 node 所属的、编辑器的直接子元素（即"一个块"） */
  function blockOf(node){
    if (node && node.nodeType === 3) node = node.parentNode;
    while (node && node !== editor && node.parentNode !== editor) node = node.parentNode;
    return (node && node !== editor) ? node : null;
  }

  /* 选区边界可能直接落在编辑器上（整块被选中），这时用 offset 找相邻的块 */
  function blockAt(container, offset){
    if (container === editor){
      const nodes = Array.from(editor.childNodes);
      for (let i = offset; i < nodes.length; i++) if (nodes[i].nodeType === 1) return nodes[i];
      for (let i = Math.min(offset, nodes.length) - 1; i >= 0; i--) if (nodes[i].nodeType === 1) return nodes[i];
      return null;
    }
    return blockOf(container);
  }

  /* 当前选区覆盖到的所有顶层块 */
  function blocksInSelection(){
    const sel = window.getSelection();
    if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return [];
    const range = sel.getRangeAt(0);
    const a = blockAt(range.startContainer, range.startOffset);
    if (!a) return [];
    const b = blockAt(range.endContainer, range.endOffset);
    if (!b || a === b) return [a];
    const kids = Array.from(editor.children);
    const i = kids.indexOf(a), j = kids.indexOf(b);
    if (i < 0 || j < 0) return [a];
    return kids.slice(Math.min(i, j), Math.max(i, j) + 1);
  }

  function placeCaret(el){
    editor.focus();
    const range = document.createRange();
    range.setStart(el, 0);
    range.collapse(true);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function placeCaretEnd(el){
    if (!el) return;
    editor.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  /* 换标签，同时把内层块（如 blockquote > p）压平，避免出现 <h2><p>…</p></h2> */
  function convertBlock(el, tag){
    const out = document.createElement(tag);
    let needBr = false;
    Array.from(el.childNodes).forEach(child => {
      const wrapped = child.nodeType === 1 && WRAPPER_IN_BLOCK.test(child.tagName);
      const kids = wrapped ? Array.from(child.childNodes) : [child];
      if (!kids.length) return;
      const meaningful = kids.some(x =>
        (x.textContent || '').trim() || (x.nodeType === 1 && /^(IMG|BR)$/.test(x.tagName)));
      if (!meaningful) return;
      if (needBr) out.appendChild(document.createElement('br'));
      kids.forEach(x => out.appendChild(x));
      needBr = wrapped;
    });
    el.replaceWith(out);
    return out;
  }

  function applyBlock(tag){
    const sel = window.getSelection();

    // 编辑器还是空的：直接建一个块
    if (!sel.rangeCount || !editor.contains(sel.anchorNode)){
      const el = document.createElement(tag);
      el.appendChild(document.createElement('br'));
      editor.appendChild(el);
      placeCaret(el);
      updateStat();
      return;
    }

    // 记下光标，转换后原地恢复（文本节点会被搬进新标签，Range 会跟着走）
    let saved = null;
    try { saved = sel.getRangeAt(0).cloneRange(); } catch (e) {}

    const targets = blocksInSelection().filter(el => SWITCHABLE.test(el.tagName));
    if (!targets.length){
      toast('列表 / 代码块内暂不支持切换标题');
      return;
    }

    // 全部已是目标标签 → 退回正文段落
    const upper = tag.toUpperCase();
    const next = targets.every(el => el.tagName === upper) ? 'p' : tag;
    const made = targets.map(el => convertBlock(el, next));

    editor.focus();
    let restored = false;
    if (saved && editor.contains(saved.startContainer) && editor.contains(saved.endContainer)){
      try {
        sel.removeAllRanges();
        sel.addRange(saved);
        restored = true;
      } catch (e) { restored = false; }
    }
    if (!restored) placeCaretEnd(made[made.length - 1]);

    updateStat();
    scheduleSave();
    scheduleHistory();
  }

  function currentBlock(){
    const sel = window.getSelection();
    if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return '';
    const el = blockAt(sel.anchorNode, sel.anchorOffset);
    return el ? el.tagName : '';
  }

  /* 链接 */
  let savedRange = null;

  function openLink(){
    const sel = window.getSelection();
    savedRange = (sel.rangeCount && editor.contains(sel.anchorNode)) ? sel.getRangeAt(0).cloneRange() : null;
    linkMask.classList.add('on');
    linkUrl.value = '';
    setTimeout(() => linkUrl.focus(), 30);
  }
  function closeLink(){ linkMask.classList.remove('on'); }

  function restoreRange(){
    focusEditor();
    if (!savedRange) return false;
    try {
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
      return !savedRange.collapsed;
    } catch (e) { return false; }
  }

  $('#linkOk').addEventListener('click', () => {
    let url = linkUrl.value.trim();
    if (!url){ closeLink(); return; }
    if (!/^https?:\/\//i.test(url) && !/^mailto:/i.test(url)) url = 'https://' + url;
    const hasSel = restoreRange();
    if (hasSel) document.execCommand('createLink', false, url);
    else document.execCommand('insertHTML', false,
      '<a href="' + esc(url) + '">' + esc(url.replace(/^https?:\/\//,'')) + '</a>');
    savedRange = null;

    updateStat(); scheduleSave();
  });
  linkUrl.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); $('#linkOk').click(); }
    if (e.key === 'Escape') closeLink();

  /* 图片 / 图集：文件选择 */
  /* 注意：不能只按 MIME 过滤。macOS 上 HEIC 的 type 经常是空字符串，
     一过滤就在进入处理逻辑之前被丢掉——这正是"HEIC 传不了"的原因。 */
  const isImageFile = f => !!f && (/^image\//.test(f.type || '') || looksHeic(f));

  fileInput.addEventListener('change', () => {
    const files = Array.from(fileInput.files || []).filter(isImageFile);
    const mode = pickerMode;
    pickerMode = 'single';
    // 先让 FileReader 拿到文件句柄，之后再清空 input
    setTimeout(() => { fileInput.value = ''; }, 0);
    if (!files.length) return;

    if (mode === 'replace'){
      const img = selectedImg;
      if (!img || !editor.contains(img)) return;
      readImages(files.slice(0, 1), out => {
        if (!out.length){ toast('这张图片读不出来，换一张试试'); return; }
        img.setAttribute('src', out[0].src);
        img.alt = out[0].alt;
        img.removeAttribute('width');
        img.removeAttribute('height');
        bake(true);
        selectImage(img);
        shrinkImage(img, true);
        toast('已替换图片');
      });
    } else if (mode === 'gallery' || files.length > 1){
      // 「图集」按钮，或者一次选了多张 —— 都做成可左右滑动的图集
      readImages(files, imgs => {
        if (!imgs.length){ toast('图片读不出来，换一张试试'); return; }
        const fig = buildGallery(imgs);
        insertBlockNode(fig);
        shrinkImagesIn(fig);

      files.forEach(insertImageFile);
