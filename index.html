  function insertSrcImage(src, name){
    const p = document.createElement('p');
    const img = document.createElement('img');
    img.setAttribute('src', src);
    img.alt = name || '';
    p.appendChild(img);
    insertBlockNode(p);
    return img;
  }

  function insertImageFile(file){
    if (!file) return;
    if (!/^image\//.test(file.type || '') && !looksHeic(file)) return;

    if (WEB_SAFE_IMG.test(file.type || '') && !looksHeic(file)){
      // 浏览器原生支持：先插入原图（保证一定看得见），压缩在后台进行
      readAsDataURL(file, src => {
        if (!src){ toast('这张图片读不出来，换一张试试'); return; }
        shrinkImage(insertSrcImage(src, file.name));
      });
    } else {
      // HEIC 等：必须先转成 Web 能显示的格式
      convertToWebImage(file, info => {
        if (!info){ warnExotic(file.name); return; }
        insertSrcImage(info.src, file.name);
        toast('已把「' + (file.name || '图片') + '」转成 JPEG（原格式浏览器显示不了）');
      });
    }
  }

  function insertFiles(files, asGallery){
    const imgs = files.filter(f => f && (/^image\//.test(f.type) || looksHeic(f)));
    if (!imgs.length) return;
    if (asGallery && imgs.length > 1){
      readImages(imgs, out => { if (out.length) insertBlockNode(buildGallery(out)); });
    } else {
      imgs.forEach(insertImageFile);
    }
  }

  /* 粘贴：清理外来格式 + 支持截图直接粘贴 */
  editor.addEventListener('paste', e => {
    const dt = e.clipboardData || window.clipboardData;
    if (!dt) return;

    const imgItems = Array.from(dt.items || []).filter(it => it.kind === 'file' && /^image\//.test(it.type));
    if (imgItems.length){
      e.preventDefault();
      insertFiles(imgItems.map(it => it.getAsFile()).filter(Boolean), true);
      return;
    }

    const html = dt.getData('text/html');
    if (html){
      e.preventDefault();
      const clean = sanitize(html);
      document.execCommand('insertHTML', false, clean);
      scheduleSave();
      return;
    }
    // 纯文本走默认行为
  });

  function sanitize(html){
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    $$('*', tmp).forEach(el => {
      ['class','id','style','width','height','dir','lang','face','color','size','align'].forEach(a => el.removeAttribute(a));
      if (el.tagName === 'FONT'){
        const sp = document.createElement('span');
        while (el.firstChild) sp.appendChild(el.firstChild);
        el.replaceWith(sp);
      }
      if (el.tagName === 'A'){
        const href = el.getAttribute('href') || '';
        if (!/^https?:/i.test(href) && !/^mailto:/i.test(href)) el.removeAttribute('href');
      }
    });
    return tmp.innerHTML;
  }

  /* 拖拽：图片插入；导出的 .html 拖回来即还原 */
  editor.addEventListener('dragover', e => { e.preventDefault(); });
  editor.addEventListener('drop', e => {
    const files = Array.from(e.dataTransfer.files || []);

    const backup = files.find(f => /\.(html?|json)$/i.test(f.name || ''));
    if (backup){
      e.preventDefault();
      if (!confirm('用「' + backup.name + '」替换当前内容？当前未保存的改动会被覆盖。')) return;
      restoreFromFile(backup, okk => {
        if (okk) toast('已从备份文件恢复');
        else toast('这个文件里没有找到正文内容');
      });
      return;
    }

    if (files.some(f => /^image\//.test(f.type) || looksHeic(f))){
      e.preventDefault();
      insertFiles(files, true);            // 一次拖多张 → 自动组成滑动图集
    }
  });

  /* 从导出的 .html 里把正文捞回来。导出的文档里正文包在
     <section style="max-width:680px;…"> 中，这里兼容几种情况。 */
  function restoreFromFile(file, cb){
    const fr = new FileReader();
    fr.onerror = () => cb(false);
    fr.onload = () => {
      try {
        const tmp = document.createElement('div');
        tmp.innerHTML = String(fr.result || '');
        const box = tmp.querySelector('#editor')
                 || tmp.querySelector('section[style*="max-width:680px"]')
                 || tmp.querySelector('body')
                 || tmp;
        const html = box ? box.innerHTML : '';
        if (!html || html.indexOf('<') < 0){ cb(false); return; }

        editor.innerHTML = html;
        normalize(editor);
        polishInline(editor);
        normalizeImages(editor);
        ensureEdges();
        bake(true);
        updateStat();
        historyReset();
        saveDoc();
        cb(true);
      } catch (e) { cb(false); }
    };
    fr.readAsText(file);
  }

  /* ---------- 图集的左右滑动 ---------- */
  const stripOf = target => (target && target.closest) ? target.closest('[data-jp="strip"]') : null;
  const cellsOf = strip => Array.from(strip.querySelectorAll('[data-jp="cell"]'));
  const scrollable = strip => !!strip && strip.scrollWidth - strip.clientWidth > 2;

  /* 当前最靠左、也就是当前显示的那张。
     注意：格子宽 84%，最后一张永远贴不到左边缘（会被 scrollLeft 上限钳住），
     所以滚到底时直接算作最后一张，否则箭头/滚轮会永远停在倒数第二张。 */
  function stripIndex(strip){
    const cells = cellsOf(strip);
    if (!cells.length) return 0;
    const max = Math.max(0, strip.scrollWidth - strip.clientWidth);
    if (max > 0 && strip.scrollLeft >= max - 2) return cells.length - 1;
    const left = strip.getBoundingClientRect().left;
    let best = 0, bestD = Infinity;
    cells.forEach((c, i) => {
      const d = Math.abs(c.getBoundingClientRect().left - left);
      if (d < bestD){ bestD = d; best = i; }
    });
    return best;
  }

  /* 滚到第 i 张。必须整张整张地走：一次只滚 100px 会被吸附拉回原位，
     那正是"左右滑动没反应"的原因。 */
  function stripTo(strip, i, smooth){
    const cells = cellsOf(strip);
    if (!cells.length) return;
    i = clamp(i, 0, cells.length - 1);
    const left = cells[i].getBoundingClientRect().left
               - strip.getBoundingClientRect().left + strip.scrollLeft;
    const max = Math.max(0, strip.scrollWidth - strip.clientWidth);
    const target = clamp(left, 0, max);
    try {
      strip.scrollTo({ left: target, behavior: smooth ? 'smooth' : 'auto' });
    } catch (e) { strip.scrollLeft = target; }
    paintStripHint(strip, i);
    syncGalNav(strip);
  }

  const stepStrip = (strip, dir) => stripTo(strip, stripIndex(strip) + dir, true);

  /* 编辑区里的计数：复制出去的是静态文案，这里只是给操作反馈 */
  function paintStripHint(strip, i){
    const fig = strip.closest('[data-jp="gallery"]');
    const hint = fig && fig.querySelector('[data-jp="hint"]');
    const cells = cellsOf(strip);
    if (!hint || cells.length < 2) return;
    if (i == null) i = stripIndex(strip);
    hint.textContent = '‹ ' + (i + 1) + ' / ' + cells.length + ' ›';
  }

  // 滚轮：一格一张（纵向滚动转横向）
  editor.addEventListener('wheel', e => {
    const strip = stripOf(e.target);
    if (!scrollable(strip)) return;
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;   // 横向滑动交给浏览器原生处理
    e.preventDefault();
    stepStrip(strip, e.deltaY > 0 ? 1 : -1);
  }, { passive:false });

  // 鼠标按住拖动平移（桌面端）
  let pan = null;
  editor.addEventListener('mousedown', e => {
    const strip = stripOf(e.target);
    if (!scrollable(strip)) return;
    pan = { strip, x: e.clientX, left: strip.scrollLeft, moved: false };
  });
  window.addEventListener('mousemove', e => {
    if (!pan) return;
    const dx = e.clientX - pan.x;
    if (Math.abs(dx) > 4) pan.moved = true;
    if (pan.moved){ pan.strip.scrollLeft = pan.left - dx; e.preventDefault(); }
  });
  window.addEventListener('mouseup', () => {
    if (pan && pan.moved){
      const strip = pan.strip;
      setTimeout(() => stripTo(strip, stripIndex(strip), true), 0);   // 松手对齐到最近一张
    }
    pan = null;
  });

  // 滚动时更新计数与箭头状态
  editor.addEventListener('scroll', e => {
    const strip = e.target;
    if (!strip || !strip.getAttribute || strip.getAttribute('data-jp') !== 'strip') return;
    paintStripHint(strip);
    syncGalNav(strip);
  }, true);

  /* ---------- 图集两侧的箭头（画布浮层，不进正文、不会被复制） ---------- */
  const galNav = $('#galNav');
  let navFig = null, navTimer = null;

  function syncGalNav(strip){
    if (!navFig || !galNav.classList.contains('on')) return;
    const cells = cellsOf(strip);
    const i = stripIndex(strip);
    const prev = galNav.querySelector('[data-dir="-1"]');
    const next = galNav.querySelector('[data-dir="1"]');
    if (prev) prev.disabled = i <= 0;
    if (next) next.disabled = i >= cells.length - 1;
  }

  function showGalNav(fig){
    const strip = fig && fig.querySelector('[data-jp="strip"]');
    if (!scrollable(strip)){ hideGalNav(); return; }
    navFig = fig;
    const cr = canvas.getBoundingClientRect();
    const sr = strip.getBoundingClientRect();
    galNav.style.left  = (sr.left - cr.left + 6) + 'px';
    galNav.style.width = Math.max(0, sr.width - 12) + 'px';
    galNav.style.top   = (sr.top - cr.top + sr.height / 2 - 17) + 'px';
    galNav.classList.add('on');
    syncGalNav(strip);
  }

  function hideGalNav(){
    galNav.classList.remove('on');
    navFig = null;
  }
  function scheduleHideNav(){ clearTimeout(navTimer); navTimer = setTimeout(hideGalNav, 300); }

  editor.addEventListener('mousemove', e => {
    const fig = e.target.closest ? e.target.closest('[data-jp="gallery"]') : null;
    if (fig){ clearTimeout(navTimer); showGalNav(fig); }
    else scheduleHideNav();
  });
  editor.addEventListener('mouseleave', scheduleHideNav);
  galNav.addEventListener('mouseenter', () => clearTimeout(navTimer));
  galNav.addEventListener('mouseleave', scheduleHideNav);
  galNav.addEventListener('mousedown', e => e.preventDefault());
  galNav.addEventListener('click', e => {
    const b = e.target.closest('[data-dir]');
    if (!b || !navFig) return;
    const strip = navFig.querySelector('[data-jp="strip"]');
    if (strip) stepStrip(strip, +b.dataset.dir);
  });

  /* ======================================================================
     10b. 撤销 / 重做：自建历史栈
          execCommand('undo') 只认浏览器自己记录的原生编辑，而插入表格/图片/
          图集、切换标题、裁剪这些是我们直接改 DOM 的，它一概不认，
          所以这里自己存快照。
     ====================================================================== */
  const H_MAX = 60;                        // 最多多少步
  const H_BYTES = 16 * 1024 * 1024;        // 快照总长度上限（图多时别吃爆内存）

  let history = [];
  let hCursor = -1;
  let hTimer = null;
  let hPendingSince = 0;

  /* ---- 选区存档：用子节点下标路径，innerHTML 重设后仍能还原 ---- */
  function pathOf(node){
    const path = [];
    let n = node;
    while (n && n !== editor){
      const parent = n.parentNode;
      if (!parent) return null;
      path.unshift(Array.prototype.indexOf.call(parent.childNodes, n));
      n = parent;
    }
    return n === editor ? path : null;
  }

  function nodeAt(path){
    let n = editor;
    for (let i = 0; i < path.length; i++){
      n = n && n.childNodes[path[i]];
      if (!n) return null;
    }
    return n;
  }

  function saveSelection(){
    const sel = window.getSelection();
    if (!sel.rangeCount) return null;
    const r = sel.getRangeAt(0);
    if (!editor.contains(r.startContainer) || !editor.contains(r.endContainer)) return null;
    const sp = pathOf(r.startContainer), ep = pathOf(r.endContainer);
    if (!sp || !ep) return null;
    return { sp, so: r.startOffset, ep, eo: r.endOffset };
  }

  function restoreSelection(s){
    editor.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    if (!s) return false;
    try {
      const sc = nodeAt(s.sp), ec = nodeAt(s.ep);
      if (!sc || !ec) return false;
      const maxOf = n => (n.nodeType === 3 ? (n.nodeValue || '').length : n.childNodes.length);
      const r = document.createRange();
      r.setStart(sc, Math.min(s.so, maxOf(sc)));
      r.setEnd(ec, Math.min(s.eo, maxOf(ec)));
      sel.addRange(r);
      return true;
    } catch (e) { return false; }
  }

  /* 打开弹窗、文件对话框时编辑器会失焦，光标位置在动手前先存下来 */
  let pendingSel = null;
  function capturePendingSelection(){ pendingSel = saveSelection(); }

  /* 结构指纹：只用来判断"这次变化是不是纯粹重排了样式" */
  function shapeSig(){
    const n = editor.querySelectorAll('img,figure,table,hr,pre,blockquote,ul,ol,h1,h2,h3,h4,h5,h6').length;
    return editor.children.length + '|' + n + '|' + editor.textContent;
  }

  function snap(){
    return { html: editor.innerHTML, sel: saveSelection(), sig: shapeSig() };
  }

  function trimHistory(){
    let chars = history.reduce((n, h) => n + h.html.length, 0);
    while (history.length > H_MAX || (chars > H_BYTES && history.length > 2)){
      chars -= history.shift().html.length;
      hCursor--;
    }
    if (hCursor < 0) hCursor = 0;
  }

  function historyCommit(force){
    clearTimeout(hTimer); hTimer = null; hPendingSince = 0;
    if (hCursor < 0){ historyReset(); return; }
    const next = snap();
    const top = history[hCursor];
    if (top && top.html === next.html) return;               // 没变

    // 结构一样 → 只是重排了样式，覆盖上一步即可，不占一次撤销
    if (!force && top && top.sig === next.sig){
      history[hCursor] = next;
    } else {
      history = history.slice(0, hCursor + 1);               // 新分支，截掉 redo
      history.push(next);
      hCursor = history.length - 1;
      trimHistory();
    }
  }

  /* DOM 改动很频繁（一次排版就要序列化整个文档），所以延后合并成一步；
     但绝不让合并无限拖下去——连续打字最多 4 秒也必须落一步，
     否则一口气写十分钟只能撤销一次。 */
  function scheduleHistory(){
    const now = Date.now();
    if (!hTimer) hPendingSince = now;
    clearTimeout(hTimer);
    const wait = (now - hPendingSince > 4000) ? 0 : 600;
    hTimer = setTimeout(() => { hTimer = null; historyCommit(false); }, wait);
  }

  function historyReset(){
    clearTimeout(hTimer); hTimer = null; hPendingSince = 0;
    history = [snap()];
    hCursor = 0;
  }

  function historyApply(entry){
    // 撤销前先记下当前光标：结构没变时它能直接映射回去，比快照里那份更贴近用户所在位置
    const here = saveSelection();
    editor.innerHTML = entry.html;
    if (!restoreSelection(here) && !restoreSelection(entry.sel)){
      const last = editor.lastElementChild;                  // 都还原不了就把光标放到末尾
      if (last) placeCaretEnd(last); else editor.focus();
    }
    updateStat();
    scheduleSave();
    if (selectedImg && !editor.contains(selectedImg)) hideImgUI();
  }

  function undo(){
    historyCommit(true);                                      // 先把当前状态落定
    if (hCursor <= 0){ toast('已经是第一步了'); return; }
    hCursor--;
    historyApply(history[hCursor]);
  }

  function redo(){
    historyCommit(true);
    if (hCursor >= history.length - 1){ toast('没有下一步了'); return; }
    hCursor++;
    historyApply(history[hCursor]);
  }

  /* ======================================================================
     10. 状态 / 字数 / 存取
     ====================================================================== */
  function updateStat(){
    const txt = plainText(editor).replace(/\s/g, '');
    const imgs = editor.querySelectorAll('img').length;
    statEl.textContent = txt.length + ' 字' + (imgs ? ' · ' + imgs + ' 图' : '');
    editor.classList.toggle('is-empty', !editor.textContent.trim() && !editor.querySelector('img'));
    updateWordCount();
  }

  /* ---------- 自动字数：文里放一个 data-jp="wordcount" 的标记，每次编辑自动刷新 ----------
     标记本身不计入字数，免得递归；正文有多少字它就显示多少。 */
  function countWords(){
    // clone 再剥标记：不改正文结构，避免触发 input / 历史
    const clone = editor.cloneNode(true);
    clone.querySelectorAll('[data-jp="wordcount"]').forEach(n => n.remove());
    return plainText(clone).replace(/\s/g, '').length;
  }
  function updateWordCount(){
    const marks = editor.querySelectorAll('[data-jp="wordcount"]');
    if (!marks.length) return;
    const n = countWords();
    const mins = Math.max(1, Math.round(n / READ_SPEED));
    const text = '全文约 ' + n + ' 字 · 约 ' + mins + ' 分钟阅读';
    marks.forEach(m => { if (m.textContent !== text) m.textContent = text; });
  }

  /* 在光标处插一个字数标记。用 section 而不是 p：公众号认 section，省一次转换 */
  function insertWordCount(){
    focusEditor();
    const m = document.createElement('section');
    m.setAttribute('data-jp', 'wordcount');
    const n = countWords();
    const mins = Math.max(1, Math.round(n / READ_SPEED));
    m.textContent = '全文约 ' + n + ' 字 · 约 ' + mins + ' 分钟阅读';
    insertBlockNode(m);
    updateStat();
    scheduleSave(); scheduleHistory();
    toast('已插入字数，随文自动更新');
  }

  let saveTimer = null;
  function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveDoc, 420); }

  let quotaWarned = false;

  function setSaveStat(kind, text){
    const el = $('#saveStat');
    if (!el) return;
    el.className = 'stat ' + (kind || '');
    el.textContent = text;
  }

  const hhmmOf = t => {
    const d = new Date(t);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  };

  /* ======================================================================
     10c. 文档存储：IndexedDB 为主，localStorage 仅作兼容兜底
          localStorage 只有 5MB，一篇带图的稿子就能撑满并静默存不上。
          IndexedDB 的配额是同源可用磁盘的一大部分，几百 MB 起步。
     ====================================================================== */
  const DB_NAME = 'jianpai', DB_VER = 2, DB_STORE = 'doc', DOC_STORE = 'docs', DB_KEY = 'current';
  const LS_CURRENT = 'jianpai.currentId';
  let idbPromise = null, idbBroken = false;
  let currentId = null;
  let docList = [];

  function idbOpen(){
    if (idbPromise) return idbPromise;
    idbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB){ reject(new Error('no indexedDB')); return; }
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        if (!db.objectStoreNames.contains(DOC_STORE)) db.createObjectStore(DOC_STORE, { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('open failed'));
      req.onblocked = () => reject(new Error('blocked'));
    }).catch(err => { idbBroken = true; idbPromise = null; throw err; });
    return idbPromise;
  }

  function idbTx(store, mode, fn){
    return idbOpen().then(db => new Promise((res, rej) => {
      let tx;
      try { tx = db.transaction(store, mode); } catch (e) { rej(e); return; }
      let out = null;
      try { const rq = fn(tx.objectStore(store)); if (rq) rq.onsuccess = () => { out = rq.result; }; }
      catch (e) { rej(e); return; }
      tx.oncomplete = () => res(out);
      tx.onerror = () => rej(tx.error || new Error('tx failed'));
      tx.onabort = () => rej(tx.error || new Error('tx aborted'));
    }));
  }

  const idbPutDoc  = v  => idbTx(DOC_STORE, 'readwrite', s => s.put(v));
  const idbGetDoc  = id => idbTx(DOC_STORE, 'readonly',  s => s.get(id));
  const idbDelDoc  = id => idbTx(DOC_STORE, 'readwrite', s => s.delete(id));
  const idbAllDocs = () => idbTx(DOC_STORE, 'readonly',  s => s.getAll())
                             .then(r => (r || []).sort((a, b) => (b.at || 0) - (a.at || 0)));
  const idbGetLegacy = () => idbTx(DB_STORE, 'readonly', s => s.get(DB_KEY));

  const newId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* 文稿名：优先用标题，其次第一个小标题，再不行取正文开头 */
  function docName(doc){
    if (!doc) return '未命名';
    const t = (doc.title || '').trim();
    if (t) return t;
    try {
      const tmp = document.createElement('div');
      tmp.innerHTML = doc.html || '';
      const h = tmp.querySelector('h1,h2,h3,h4');
      if (h && h.textContent.trim()) return h.textContent.trim().slice(0, 18);
      const txt = (tmp.textContent || '').replace(/\s+/g, '');
      if (txt) return txt.slice(0, 14);
    } catch (e) {}
    return '（空白）';
  }

  let saveChain = Promise.resolve();

  function saveDoc(){
    if (!currentId) currentId = newId();
    const existing = docList.find(d => d.id === currentId);
    const payload = {
      id: currentId,
      html: editor.innerHTML,
      title: (existing && existing.title) || '',
      at: Date.now()
    };
    // 串行化写入，避免连续保存互相竞争
    saveChain = saveChain.then(() => idbPutDoc(payload)).then(() => {
      quotaWarned = false;
      const mb = payload.html.length * 2 / 1048576;
      setSaveStat('ok', '已保存 ' + hhmmOf(payload.at) + (mb > 4 ? ' · ' + mb.toFixed(1) + 'MB' : ''));
      // IndexedDB 已经存好，把旧的 localStorage 副本删掉，腾出那 5MB 配额
      try { localStorage.removeItem(LS_DOC); } catch (e) {}
      syncDocRow(payload);
    }).catch(() => {
      // IndexedDB 不可用 → 退回 localStorage（受 5MB 限制）
      try {
        localStorage.setItem(LS_DOC, JSON.stringify(payload));
        quotaWarned = false;
        setSaveStat('ok', '已保存 ' + hhmmOf(payload.at) + '（单篇兼容模式）');
      } catch (e) {
        setSaveStat('warn', '⚠ 未保存 · 点此导出');
        if (!quotaWarned){
          quotaWarned = true;
          toast('⚠️ 自动保存失败。点右上角红字「未保存」即可导出备份，别关页面', 9000);
        }
      }
    });
    return saveChain;
  }

  function saveCfg(){
    try { localStorage.setItem(LS_CFG, JSON.stringify(state)); } catch (e) {}
  }

  /* 防抖期间关页面/切后台会把最后几百毫秒的输入丢掉，这里兜底立刻落盘 */
  function flushSave(){
    clearTimeout(saveTimer); saveTimer = null;
    saveDoc();
    saveCfg();
  }
  window.addEventListener('beforeunload', flushSave);
  window.addEventListener('pagehide', flushSave);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushSave();
  });

  /* 旧版本只有单一 gap → 段前 0 / 段后 = gap，视觉不变；
     「居中」曾算标题样式，现在不算风格，老配置回落成纯文字 */
  function migrateState(o){
    if (!o || typeof o !== 'object') return o;
    if (o.gap != null && o.spAfter == null){ o.spAfter = o.gap; o.spBefore = 0; }
    if (o.spBefore == null) o.spBefore = 0;
    if (o.spAfter == null) o.spAfter = 14;
    // 标题样式只剩 bar / plainColor；旧的 center/fill/plain 一律归到 bar，
    // 旧的 plainColor 保留（它现在 = 居中 + 主题色）
    if (o.hStyle !== 'bar' && o.hStyle !== 'plainColor') o.hStyle = 'bar';
    if (!FONTS[o.font]) o.font = 'sys';
    delete o.gap;
    return o;
  }

  async function loadAll(){
    try {
      const s = migrateState(JSON.parse(localStorage.getItem(LS_CFG) || 'null'));
      if (s && typeof s === 'object') Object.assign(state, s);
    } catch (e) {}

    // 当前文稿 id（记在 localStorage，小，不占配额）
    try { currentId = localStorage.getItem(LS_CURRENT) || currentId; } catch (e) {}

    // 先探测 IndexedDB 可不可用（jsdom、隐私模式可能不支持）
    let idbAvailable = false;
    try { await idbOpen(); idbAvailable = true; } catch (e) {}

    // IDB 不可用 → 退回单篇 localStorage
    if (!idbAvailable){
      try {
        const doc = JSON.parse(localStorage.getItem(LS_DOC) || 'null');
        if (doc && doc.html){
          editor.innerHTML = doc.html;
          if (doc.at) setSaveStat('ok', '上次保存 ' + hhmmOf(doc.at));
        }
      } catch (e) {}
      syncControls();
      renderDocs();
      return;
    }

    // 旧版本单篇：如果还没有任何文稿，就搬成第一篇
    let migrated = false;
    try {
      if (!(await idbAllDocs()).length){
        let legacy = null;
        try { legacy = await idbGetLegacy(); } catch (e) {}
        if (!legacy || !legacy.html){
          try { legacy = JSON.parse(localStorage.getItem(LS_DOC) || 'null'); } catch (e) {}
        }
        if (legacy && legacy.html){
          const doc = {
            id: currentId || newId(),
            html: legacy.html,
            title: legacy.title || '',
            author: legacy.author || '',
            at: legacy.at || Date.now()
          };
          currentId = doc.id;
          try { await idbPutDoc(doc); } catch (e) {}
          migrated = true;
          setSaveStat('ok', '已搬到文稿列表');
        }
      }
    } catch (e) {}

    // 拉全量列表
    try { docList = await idbAllDocs(); } catch (e) { docList = []; }

    // 定位当前文稿
    if (!currentId) currentId = docList.length ? docList[0].id : newId();
    try { localStorage.setItem(LS_CURRENT, currentId); } catch (e) {}

    let doc = docList.find(d => d.id === currentId);
    if (!doc){ try { doc = await idbGetDoc(currentId); } catch (e) {} }
    if (!doc && docList.length) doc = docList[0];

    if (doc && doc.html){
      editor.innerHTML = doc.html;
      if (doc.at && !migrated) setSaveStat('ok', '上次保存 ' + hhmmOf(doc.at));
    }
    syncControls();
    renderDocs();
  }

  /* ---------- 文稿列表 ---------- */
  function renderDocs(){
    const box = $('#docList');
    if (!box) return;
    const note = $('#docNote');

    if (idbBroken){
      box.innerHTML = '<div class="doc-empty">浏览器不支持多篇存储，只能保留当前这一篇。请记得定期「导出」备份。</div>';
      if (note) note.textContent = '';
      return;
    }

    if (!docList.length){
      box.innerHTML = '<div class="doc-empty">还没有文稿。写完一篇会自动存进这里。</div>';
      if (note) note.textContent = '每篇文稿都存在本机（IndexedDB），可随时切换回来，不会互相覆盖。';
      return;
    }

    box.innerHTML = docList.map(d => {
      const on = d.id === currentId;
      const d8 = new Date(d.at || 0);
      const ts = ('0'+d8.getHours()).slice(-2) + ':' + ('0'+d8.getMinutes()).slice(-2);
      return '<div class="doc' + (on ? ' on' : '') + '" data-id="' + d.id + '" title="切换到这里">' +
        '<span class="nm">' + esc(docName(d)) + '</span>' +
        '<span class="sub">' + ts + '</span>' +
        '<button class="x" data-rn="' + d.id + '" title="重命名">✎</button>' +
        '<button class="x" data-del="' + d.id + '" title="删除这篇">×</button>' +
      '</div>';
    }).join('');

    if (note) note.textContent = '点文稿切换，× 删除，＋ 新建一篇。';
  }

  /* 保存后只轻量刷新当前那一行的名字和时间，避免整表重绘 */
  function syncDocRow(doc){
    if (!doc) return;
    const item = docList.find(x => x.id === doc.id);
    if (item){ item.html = doc.html; item.title = doc.title; item.author = doc.author; item.at = doc.at; }
    else { docList.unshift(doc); }
    if (doc.id === currentId){
      const row = $('#docList [data-id="' + doc.id + '"]');
      if (row){
        row.querySelector('.nm').textContent = esc(docName(doc));
        const d8 = new Date(doc.at);
        row.querySelector('.sub').textContent =
          ('0'+d8.getHours()).slice(-2) + ':' + ('0'+d8.getMinutes()).slice(-2);
      }
    }
  }

  /* ---- 新建一篇 / 切换 / 删除 ---- */
  async function newDoc(){
    const hasContent = editor.textContent.trim() || editor.querySelector('img');
    if (hasContent && !confirm('开始新的一篇？当前这篇已自动保存进「文稿」列表，随时可以切回来。'))
      return;
    await saveDoc();                                    // 确保当前这篇落盘
    currentId = newId();
    try { localStorage.setItem(LS_CURRENT, currentId); } catch (e) {}
    editor.innerHTML = '';
    updateStat();
    historyReset();
    setSaveStat('ok', '新的一篇');
    renderDocs();
    editor.focus();
  }

  async function switchDoc(id){
    if (id === currentId) return;
    await saveDoc();                                    // 先把当前这篇存好
    let doc = null;
    try { doc = await idbGetDoc(id); } catch (e) {}
    if (!doc){ toast('这篇读不出来了'); return; }

    currentId = id;
    try { localStorage.setItem(LS_CURRENT, id); } catch (e) {}
    editor.innerHTML = doc.html || '';
    normalize(editor);
    polishInline(editor);
    normalizeImages(editor);
    ensureEdges();
    bake(true);
    updateStat();
    historyReset();
    if (doc.at) setSaveStat('ok', '上次保存 ' + hhmmOf(doc.at));
    renderDocs();
    toast('已切换到「' + docName(doc) + '」');
  }

  async function deleteDoc(id){
    const doc = docList.find(d => d.id === id);
    if (!confirm('删除「' + (doc ? docName(doc) : '这篇') + '」？删除后无法恢复。'))
      return;
    try { await idbDelDoc(id); } catch (e) {}
    docList = docList.filter(d => d.id !== id);

    if (id === currentId){
      // 删的就是当前这篇 → 切到列表里第一篇，没有就新建
      if (docList.length){
        await switchDoc(docList[0].id);
      } else {
        currentId = newId();
        try { localStorage.setItem(LS_CURRENT, currentId); } catch (e) {}
        editor.innerHTML = '';
        updateStat();
        historyReset();
        renderDocs();
      }
    } else {
      renderDocs();
    }
    toast('已删除');
  }

  /* ---- 重命名 ---- */
  function renameDoc(id){
    const doc = docList.find(d => d.id === id);
    if (!doc) return;
    const old = docName(doc);
    const name = prompt('重命名文稿', old);
    if (!name || name === old) return;
    doc.title = name.trim();
    if (doc.id === currentId){
      const payload = { id: currentId, html: editor.innerHTML, title: doc.title, at: Date.now() };
      saveChain = saveChain.then(() => idbPutDoc(payload)).then(() => {
        syncDocRow(payload);
      });
    } else {
      idbPutDoc(doc).then(() => renderDocs());
    }
    renderDocs();
    toast('已重命名为「' + name.trim() + '」');
  }

  /* 文稿列表事件：点行切换，点 × 删除，点 ✎ 重命名 */
  $('#docList').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del){ e.stopPropagation(); deleteDoc(del.dataset.del); return; }
    const rn = e.target.closest('[data-rn]');
    if (rn){ e.stopPropagation(); renameDoc(rn.dataset.rn); return; }
    const row = e.target.closest('.doc');
    if (row) switchDoc(row.dataset.id);
  });
  $('#btnNewDoc').addEventListener('click', newDoc);

  /* ======================================================================
     11. 侧栏控件
     ====================================================================== */
  function buildFontChips(){
    const box = $('#fonts');
    box.innerHTML = FONT_OPTIONS.map(f => {
      const ok = fontAvailable(f.stack);
      const tip = f.name + '：' + f.note + (ok ? '' : '（本机未安装，编辑区看不出差别，但复制到公众号后读者端仍会生效）');
      return '<button class="chip' + (ok ? '' : ' miss') + '" data-font="' + f.id + '"' +
        ' title="' + esc(tip) + '"' +
        ' style="font-family:' + f.stack.replace(/"/g, "'") + ';">' +
        f.name + (ok ? '' : '<i class="nf">未装</i>') + '</button>';
    }).join('');
    updateFontNote();
  }

  function updateFontNote(){
    const opt = FONT_OPTIONS.find(f => f.id === state.font) || FONT_OPTIONS[0];
    const ok = fontAvailable(opt.stack);
    const el = $('#fontNote');
    if (!el) return;
    el.textContent = ok ? opt.note : '本机未安装「' + opt.name + '」，编辑区会回落到其它字体；公众号读者端仍按该字体显示。';
  }

  const SWATCH_COLORS = [
    '#1a1a1a', '#e84393', '#7478A8', '#4a7ab5'
  ];
  const LS_COLORS = 'jianpai.colors';
  let savedColors = [];
  try { savedColors = JSON.parse(localStorage.getItem(LS_COLORS) || '[]'); } catch (e) { savedColors = []; }

  function saveColors(){
    try { localStorage.setItem(LS_COLORS, JSON.stringify(savedColors)); } catch (e) {}
  }

  function allColors(){
    return SWATCH_COLORS.concat(savedColors);
  }

  function buildSwatches(){
    const box = $('#swatches');
    if (!box) return;
    box.innerHTML = allColors().map((c, i) => {
      const isSaved = i >= SWATCH_COLORS.length;
      const delBtn = isSaved ? '<span class="sw-del" data-del-color="' + c + '" title="删除">×</span>' : '';
      return '<div class="sw-wrap"><button class="sw' + (isSaved ? ' saved' : '') + '" data-color="' + c + '" style="background:' + c + ';" title="' + c + '"></button>' + delBtn + '</div>';
    }).join('');
  }

  function syncSwatches(){
    const cur = (state.customAccent || '#313c3f').toLowerCase();
    $$('#swatches .sw').forEach(b => b.classList.toggle('on', b.dataset.color.toLowerCase() === cur));
  }

  $('#swatches').addEventListener('click', e => {
    // 删除按钮
    const del = e.target.closest('[data-del-color]');
    if (del){
      e.stopPropagation();
      const c = del.dataset.delColor;
      savedColors = savedColors.filter(x => x !== c);
      saveColors();
      buildSwatches();
      syncSwatches();
      toast('已删除');
      return;
    }
    // 选择颜色
    const b = e.target.closest('[data-color]');
    if (!b) return;
    const c = b.dataset.color;
    state.customAccent = c;
    $('#accentPick').value = c;
    $('#accentHex').textContent = c;
    applyVisual(); saveCfg();
    console.log('[DEBUG] swatch: color=' + c + ' hStyle=' + state.hStyle);
    // 直接更新标题内联样式，不等 bake
    if (state.hStyle === 'plainColor'){
      $$('.editor h2, .editor h3').forEach(h => {
        const s = h.getAttribute('style') || '';
        const newS = s.replace(/color:[^;]+/, 'color:' + c) || 'color:' + c + ';';
        console.log('[DEBUG] swatch h2/h3:', h.tagName, 'old:', s, 'new:', newS);
        h.setAttribute('style', newS);
      });
    }
    if (editor.textContent.trim() || editor.querySelector('img')) bake(true);
    syncSwatches();
    toast('主题色 → ' + c);
  });

  $('#btnSaveColor').addEventListener('click', () => {
    const c = $('#accentPick').value;
    if (allColors().indexOf(c) !== -1){
      toast('这个颜色已保存');
      return;
    }
    savedColors.push(c);
    saveColors();
    buildSwatches();
    syncSwatches();
    toast('已保存主题色 ' + c);
  });

  function syncControls(){
    $('#accentPick').value = state.customAccent || '#313c3f';
    $('#accentHex').textContent = state.customAccent || '#313c3f';
    $('#rFs').value = state.fs;  $('#vFs').textContent = state.fs;
    $('#rLh').value = state.lh;  $('#vLh').textContent = Number(state.lh).toFixed(2);
    $('#rLs').value = state.ls;  $('#vLs').textContent = Number(state.ls).toFixed(1);
    $('#rSide').value = state.side || 0;  $('#vSide').textContent = state.side || 0;
    $$('#fonts .chip').forEach(b => b.classList.toggle('on', b.dataset.font === state.font));
    syncSwatches();
    updateFontNote();
    $$('#hstyles .chip').forEach(b => b.classList.toggle('on', b.dataset.h === state.hStyle));
    $$('[data-toggle]').forEach(b => b.classList.toggle('on', !!state[b.dataset.toggle]));
  }

  function bindRange(id, key, fmt, parse){
    const el = $(id);
    el.addEventListener('input', () => {
      state[key] = (parse || parseFloat)(el.value);
      syncControls(); applyVisual(); saveCfg(); scheduleBake();
    });
  }
  bindRange('#rFs','fs');
  bindRange('#rLh','lh');
  bindRange('#rLs','ls');
  bindRange('#rSide','side');


  $('#accentPick').addEventListener('input', e => {
    const newColor = e.target.value;
    const oldColor = state.customAccent;
    state.customAccent = newColor;
    $('#accentHex').textContent = newColor;
    // 如果之前选中的是已保存颜色，更新保存的颜色
    if (oldColor){
      const idx = savedColors.findIndex(c => c.toLowerCase() === oldColor.toLowerCase());
      if (idx !== -1){
        savedColors[idx] = newColor;
        saveColors();
        buildSwatches();
        syncSwatches();
      }
    }
    applyVisual(); saveCfg();
    // 直接更新标题内联样式，不等 bake
    if (state.hStyle === 'plainColor'){
      $$('.editor h2, .editor h3').forEach(h => {
        const s = h.getAttribute('style') || '';
        h.setAttribute('style', s.replace(/color:[^;]+/, 'color:' + newColor) || 'color:' + newColor + ';');
      });
    }
    if (editor.textContent.trim() || editor.querySelector('img')) bake(true);
  });

  $('#fonts').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    state.font = b.dataset.font;
    if (!fontAvailable(FONTS[state.font] || '')){
      const opt = FONT_OPTIONS.find(f => f.id === state.font);
      toast('本机未安装「' + opt.name + '」，已设为该字体但编辑区可能看不出差别');
    }
    syncControls(); applyVisual(); saveCfg(); scheduleBake();
  });
  $('#hstyles').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    state.hStyle = b.dataset.h; syncControls(); applyVisual(); saveCfg();
    // 强制重排所有标题
    const c = cfg();
    console.log('[DEBUG] hstyles: hStyle=' + state.hStyle + ' accent=' + c.accent + ' head=' + c.head);
    $$('.editor h2, .editor h3').forEach(h => {
      const isColor = state.hStyle === 'plainColor';
      const col = isColor ? c.accent : c.head;
      const wt = isColor ? 600 : (h.tagName === 'H2' ? 700 : 600);
      const oldStyle = h.getAttribute('style') || '';
      let st = oldStyle.replace(/color:[^;]+/, 'color:' + col);
      st = st.replace(/font-weight:[^;]+/, 'font-weight:' + wt);
      if (isColor && !/text-align/.test(st)) st += 'text-align:center;';
      console.log('[DEBUG] h2/h3:', h.tagName, 'old:', oldStyle, 'new:', st);
      h.setAttribute('style', st);
    });
    if (editor.textContent.trim() || editor.querySelector('img')) bake(true);
  });
  $$('[data-toggle]').forEach(b => b.addEventListener('click', () => {
    state[b.dataset.toggle] = !state[b.dataset.toggle];
    syncControls(); applyVisual(); saveCfg(); scheduleBake();
  }));

  let bakeTimer = null;
  function scheduleBake(){
    clearTimeout(bakeTimer);
    bakeTimer = setTimeout(() => {
      if (editor.textContent.trim() || editor.querySelector('img')) bake(true);
    }, 260);
  }

  /* ======================================================================
     12. 顶栏 & 编辑器事件
     ====================================================================== */
  $('#saveStat').addEventListener('click', () => {
    if ($('#saveStat').classList.contains('warn')){
      exportHTML();
      toast('已导出备份文件，存到桌面即可', 5000);
    } else {
      saveDoc().then(() => toast('已保存'));
    }
  });

  /* ---------- 文字变色：一键上主题色，再点一次取消 ---------- */
  function rgbToHex(rgb){
    const m = rgb.match(/rgb\((\d+),\s*(\d+),\s*(\d+)/);
    if (!m) return rgb;
    return '#' + [m[1], m[2], m[3]].map(x => {
      const h = parseInt(x).toString(16);
      return h.length === 1 ? '0' + h : h;
    }).join('');
  }
  function selectionColor(){
    const sel = window.getSelection();
    if (!sel.rangeCount) return null;
    const n = sel.anchorNode;
    let el = (n && n.nodeType === 3) ? n.parentNode : n;
    while (el && el !== editor && (!el.getBoundingClientRect || !el.getBoundingClientRect().width)) el = el.parentNode;
    if (!el || !el.getBoundingClientRect) return null;
    const cs = document.defaultView.getComputedStyle(el);
    return rgbToHex(cs.color || '').toLowerCase();
  }
  $('#btnTextColor').addEventListener('click', () => {
    const sel = window.getSelection();
    if (!sel.rangeCount || sel.isCollapsed || !editor.contains(sel.anchorNode)){
      toast('先选中要变色的文字');
      return;
    }
    editor.focus();
    const c = cfg();
    const cur = selectionColor();
    // execCommand 只认具体色值，不吃 var()，所以两边都取实值
    if (cur && cur === c.accent.toLowerCase()){
      // 已经是主题色 → 取消，回到正文字色
      document.execCommand('foreColor', false, c.text);
      toast('已取消颜色');
    } else {
      document.execCommand('foreColor', false, c.accent);
      toast('已用主题色 ' + c.accent);
    }
    scheduleSave(); scheduleHistory();
  });

  $('#btnBake').addEventListener('click', () => bake(false));
  $('#btnCopy').addEventListener('click', copyRich);
  $('#btnExport').addEventListener('click', exportHTML);


  $('#btnClear').addEventListener('click', () => {
    if (!confirm('确定清空全部内容吗？')) return;
    editor.innerHTML = '';
    updateStat(); saveDoc(); scheduleHistory();
    toast('已清空');
  });

  const btnSide = $('#btnSide');
  btnSide.addEventListener('click', () => side.classList.toggle('open'));
  document.addEventListener('click', e => {
    if (window.innerWidth > 960) return;
    if (side.classList.contains('open') && !side.contains(e.target) && !btnSide.contains(e.target))
      side.classList.remove('open');
  });



  editor.addEventListener('input', () => {
    updateStat(); scheduleSave(); scheduleHistory();
    // 只在文里确实有图集时才多走这一趟
    if (editor.querySelector('[data-jp="strip"]')) cleanEmptyCells();
  });
  editor.addEventListener('keyup', updateStat);
  editor.addEventListener('mouseup', updateStat);

  // 光标落在标题/引用里时，工具栏按钮显示选中态
  document.addEventListener('selectionchange', () => {
    const cur = currentBlock();
    $$('#toolbar .tb[data-block]').forEach(b =>
      b.classList.toggle('on', b.dataset.block.toUpperCase() === cur));
  });

  document.addEventListener('keydown', e => {
    const meta = e.metaKey || e.ctrlKey;
    if (!meta) return;
    // 焦点在输入框里时让浏览器自己撤销，别抢
    const tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA')) return;
    if (e.key === 'z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if ((e.key === 'z' && e.shiftKey) || e.key === 'y'){ e.preventDefault(); redo(); return; }
    if (e.key === 's'){ e.preventDefault(); bake(false); }
    else if (e.key === 'Enter'){ e.preventDefault(); copyRich(); }
    else if (e.key === 'k'){ e.preventDefault(); openLink(); }
  });

  /* 粘贴图片外，任何改版都在复制/导出时自动重排 —— 已内置在 copyRich/exportHTML */

  /* ======================================================================
     13. 启动
     ====================================================================== */
  async function init(){
    try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
    buildFontChips();
    buildSwatches();
    buildTableGrid();
    loadTemplates();
    await loadAll();          // 文档现在从 IndexedDB 读，是异步的
    applyVisual();
    updateStat();

    if (!editor.textContent.trim() && !editor.querySelector('img')){
      // 首次使用的示例内容（不落盘，用户删掉即可）
      editor.innerHTML =
        '<h2>选个风格，写，复制</h2>' +
        '<p>左边写正文，右边调样式，点「一键排版」后复制进公众号后台。</p>' +
        '<blockquote>排版不该是一件需要学习的事。</blockquote>' +
        '<ul>' +
        '<li>粘贴会自动清掉外来格式</li>' +
        '<li>图片可裁剪、加图注、多选成滑动图集</li>' +
        '<li>样式能存成模板，下次一键套用</li>' +
        '</ul>' +
        '<p>⌘S 排版 · ⌘Enter 复制 · ⌘K 链接</p>';
      updateStat();
    } else {
      // 恢复的内容先按当前风格重排一次
      bake(true);
    }
    historyReset();
  }

  init();
})();
</script>
</body>
</html>
